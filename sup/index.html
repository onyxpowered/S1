<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<meta name="color-scheme" content="light dark">
<title>Sup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
<style>
:root{
  --accent:#0f9148;--accent-hover:#0c7f3e;--accent-fg:#ffffff;--accent-soft:rgba(15,145,72,.12);
  --bg:#ffffff;--bg2:#fafafa;--bg3:#efefef;--fg:#000000;--fg2:#737373;--fg3:#a8a8a8;
  --line:#dbdbdb;--line2:#efefef;--hover:rgba(0,0,0,.04);--sel:#efefef;
  --them:#efefef;--them-fg:#000000;--card:#ffffff;--scrim:rgba(0,0,0,.65);--danger:#ed4956;
  --shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.14);
  --font:"Geist",sans-serif;
}
[data-theme="dark"]{
  --accent:#12a152;--accent-hover:#15b35b;--accent-soft:rgba(18,161,82,.18);
  --bg:#000000;--bg2:#121212;--bg3:#262626;--fg:#f5f5f5;--fg2:#a8a8a8;--fg3:#737373;
  --line:#262626;--line2:#363636;--hover:rgba(255,255,255,.06);--sel:#1f1f1f;
  --them:#262626;--them-fg:#f5f5f5;--card:#262626;--scrim:rgba(0,0,0,.7);
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 8px 28px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-width:1000px;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button,input,textarea,select{font-family:var(--font);font-size:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
::selection{background:var(--accent);color:var(--accent-fg)}
svg{display:block}
.hidden{display:none!important}
a{color:inherit}

.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:16px;height:16px}
.icon.xs{width:12px;height:12px}
.icon.md{width:20px;height:20px}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:background .15s,opacity .15s}
.ibtn:hover{background:var(--hover)}
.ibtn:active{opacity:.6}
.ibtn.on{color:var(--accent)}

.btn{height:32px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;background:var(--bg3);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,opacity .15s;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
[data-theme="dark"] .btn:hover{filter:brightness(1.2)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);filter:none}
.btn.block{width:100%}
.btn.lg{height:44px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.tbtn{font-weight:600;color:var(--accent);font-size:14px;padding:4px 2px}
.tbtn:hover{color:var(--accent-hover)}
.tbtn:disabled{opacity:.35;cursor:default}

.avatar{flex:none;border-radius:50%;background:var(--bg3);color:var(--fg2);display:grid;place-items:center;font-weight:600;letter-spacing:.01em;user-select:none;position:relative}
.avatar.group{background:none}
.avatar.group span{position:absolute;border-radius:50%;background:var(--bg3);color:var(--fg2);display:grid;place-items:center;font-weight:600;box-shadow:0 0 0 2px var(--bg)}
.avatar .pres{position:absolute;right:0;bottom:0;width:26%;height:26%;min-width:10px;min-height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2.5px var(--bg)}

.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.05em}
.wordmark{font-size:52px;font-weight:700;letter-spacing:-.055em;line-height:1}
.wordmark i{font-style:normal;color:var(--accent)}

#app{height:100%;display:flex}
.center{flex:1;display:grid;place-items:center;padding:24px;overflow:auto;background:var(--bg)}
.card{width:350px;border:1px solid var(--line);border-radius:4px;padding:40px 40px 28px;text-align:center;background:var(--bg)}
.card+.card{margin-top:10px;padding:22px 32px}
.card h2{font-size:16px;font-weight:600;color:var(--fg2);margin:18px 0 26px;line-height:1.35}
.field{display:flex;align-items:center;width:100%;height:40px;padding:0 10px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);font-size:14px;margin-bottom:8px;transition:border-color .15s}
.field:focus-within,.field:focus{border-color:var(--fg3)}
.field input{flex:1;height:100%;min-width:0}
.field span{color:var(--fg2);margin-right:1px}
.card .err{min-height:18px;font-size:13px;color:var(--danger);margin:8px 0 4px}
.card .btn{margin-top:6px}
.card .fine{font-size:13px;color:var(--fg2);line-height:1.45}
.card .fine b{color:var(--fg);font-weight:600}
.card .fine .icon{display:inline-block;vertical-align:-1px}
.notice h2{font-size:18px;font-weight:600;margin:22px 0 8px}
.notice p{color:var(--fg2);max-width:420px;line-height:1.5}
.notice .btn{margin-top:20px}

.rail{width:72px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0 18px;gap:6px;background:var(--bg)}
.rail .logo{width:48px;height:48px;display:grid;place-items:center;margin-bottom:20px}
.rbtn{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;position:relative;color:var(--fg);transition:background .15s,transform .1s}
.rbtn:hover{background:var(--hover)}
.rbtn:active{transform:scale(.94)}
.rbtn.on .icon{stroke-width:2.75}
.rbtn .badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.rail .grow{flex:1}

.list-pane{width:397px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--bg)}
.lp-head{height:75px;flex:none;padding:0 16px 0 24px;display:flex;align-items:center;gap:6px}
.lp-head h1{flex:1;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.lp-head h1 .icon{width:20px;height:20px}
.search{margin:0 24px 6px;height:40px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--fg2);flex:none}
.search input{flex:1;height:100%;color:var(--fg);font-size:15px}
.search input::placeholder{color:var(--fg2)}
.lp-sub{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 10px;flex:none}
.lp-sub b{font-size:16px;font-weight:700}
.lp-sub button{font-size:14px;font-weight:600;color:var(--fg2)}
.lp-sub button:hover{color:var(--fg)}
.lp-sub .back{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:16px;font-weight:700}
.lp-sub .back:hover{color:var(--fg)}
.list{flex:1;overflow-y:auto;padding-bottom:16px}
.item{display:flex;align-items:center;gap:12px;padding:8px 24px;cursor:pointer;position:relative;user-select:none}
.item:hover{background:var(--hover)}
.item.active{background:var(--sel)}
.item .body{flex:1;min-width:0}
.item .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.item .sub{display:flex;align-items:center;gap:4px;color:var(--fg2);font-size:12px;margin-top:3px;min-width:0}
.item .sub .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.item .sub .tm{flex:none}
.item.unread .name{font-weight:600}
.item.unread .sub{color:var(--fg);font-weight:600}
.item .udot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:none}
.item.unread .udot{display:block}
.item .mute{color:var(--fg3)}
.empty{padding:56px 32px;text-align:center;color:var(--fg2);line-height:1.5}
.empty .ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--fg);display:grid;place-items:center;margin:0 auto 16px;color:var(--fg)}
.empty .ring .icon{width:44px;height:44px;stroke-width:1.5}
.empty b{display:block;color:var(--fg);font-size:20px;font-weight:400;margin-bottom:4px}
.empty .btn{margin-top:16px}

.main{flex:1;min-width:0;display:flex;background:var(--bg)}
.chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--fg2);gap:4px}
.placeholder .ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--fg);display:grid;place-items:center;margin-bottom:12px;color:var(--fg)}
.placeholder .ring .icon{width:44px;height:44px;stroke-width:1.5}
.placeholder b{color:var(--fg);font-size:20px;font-weight:400}
.placeholder .btn{margin-top:14px}
.chead{height:75px;flex:none;padding:0 12px 0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.chead .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1;cursor:pointer}
.chead .who .t{min-width:0}
.chead .who .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.chead .who .s{font-size:12px;color:var(--fg2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .acts{display:flex;gap:2px}
.verified{color:var(--accent);display:inline-flex}

.banner{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg)}
.banner .icon{width:18px;height:18px;color:var(--fg2)}
.banner span{flex:1}
.banner button{font-weight:600;color:var(--accent)}

.msgs{flex:1;overflow-y:auto;padding:0 16px 8px;display:flex;flex-direction:column}
.msgs .spacer{flex:1}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 0 26px;gap:2px}
.intro .avatar{margin-bottom:12px}
.intro .n{font-size:20px;font-weight:600}
.intro .h{font-size:14px;color:var(--fg2)}
.intro .e2e{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;color:var(--fg2);background:var(--bg3);padding:6px 12px;border-radius:14px}
.intro .e2e .icon{width:13px;height:13px}
.intro .btn{margin-top:14px}
.sep{text-align:center;font-size:12px;color:var(--fg2);margin:18px 0 10px;font-weight:500}
.sys{text-align:center;font-size:12px;color:var(--fg2);margin:8px auto;max-width:80%;line-height:1.45;display:flex;align-items:center;justify-content:center;gap:6px}
.sys .icon{width:14px;height:14px}
.sys b{font-weight:600;color:var(--fg2)}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px;position:relative}
.row.first{margin-top:8px}
.row.me{justify-content:flex-end}
.row .av{width:28px;flex:none;align-self:flex-end}
.stack{display:flex;flex-direction:column;max-width:min(60%,560px);min-width:0}
.row.me .stack{align-items:flex-end}
.row.them .stack{align-items:flex-start}
.sender{font-size:12px;color:var(--fg2);margin:0 12px 4px}
.bubble{position:relative;padding:8px 12px;border-radius:22px;font-size:15px;line-height:1.33;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;user-select:text;transition:transform .15s}
.row.me .bubble{background:var(--accent);color:var(--accent-fg)}
.row.them .bubble{background:var(--them);color:var(--them-fg)}
.row.me:not(.last) .bubble{border-bottom-right-radius:4px}
.row.me:not(.first) .bubble{border-top-right-radius:4px}
.row.them:not(.last) .bubble{border-bottom-left-radius:4px}
.row.them:not(.first) .bubble{border-top-left-radius:4px}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.bubble.big{background:none!important;padding:0 2px;font-size:44px;line-height:1.1}
.bubble.na{background:none!important;color:var(--fg2)!important;border:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:6px}
.bubble.na .icon{width:13px;height:13px}
.bubble.hid{cursor:pointer}
.row.pending .bubble{opacity:.6}
.reply-label{font-size:12px;color:var(--fg2);margin:4px 12px 4px;display:flex;align-items:center;gap:4px}
.reply-quote{font-size:13px;padding:8px 12px;border-radius:18px;background:var(--bg3);color:var(--fg2);margin-bottom:-14px;padding-bottom:20px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;opacity:.85}
.row.me .reply-quote{margin-right:0}
.meta{font-size:12px;color:var(--fg2);margin:3px 12px 0;display:flex;align-items:center;gap:4px}
.receipt{font-size:12px;color:var(--fg2);text-align:right;margin:4px 6px 0}
.receipt.fail{color:var(--danger)}
.reacts{display:flex;gap:2px;margin-top:-6px;z-index:1;position:relative}
.row.me .reacts{margin-right:8px}
.row.them .reacts{margin-left:8px}
.react-pill{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 7px;border-radius:12px;background:var(--bg3);border:2px solid var(--bg);font-size:13px;cursor:pointer}
.react-pill.mine{background:var(--accent-soft)}
.react-pill span{font-size:11px;font-weight:600;color:var(--fg2)}
.hacts{display:flex;gap:0;opacity:0;align-self:center;flex:none;transition:opacity .12s;color:var(--fg2)}
.hacts button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.hacts button:hover{color:var(--fg);background:var(--hover)}
.hacts .icon{width:17px;height:17px}
.row:hover .hacts{opacity:1}
.row.me .hacts{order:-1;flex-direction:row-reverse}
.flash .bubble{transform:scale(1.04)}
.typing{display:flex;gap:4px;padding:12px 14px;border-radius:22px;background:var(--them);width:max-content;margin:8px 0 2px 36px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--fg2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.typing-wrap .who{font-size:12px;color:var(--fg2);margin:8px 0 -4px 48px}

.composer{padding:0 16px 20px;flex:none;position:relative}
.ctx{display:flex;align-items:center;gap:10px;margin:8px 4px 8px;padding:6px 4px 6px 12px;border-left:2px solid var(--accent);font-size:13px;color:var(--fg2)}
.ctx div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx b{color:var(--fg);font-weight:600}
.ctx .ibtn{width:28px;height:28px}
.ctx .icon{width:16px;height:16px}
.cbox{display:flex;align-items:flex-end;gap:4px;border:1px solid var(--line);border-radius:22px;min-height:44px;padding:2px 14px 2px 6px;background:var(--bg)}
.cbox .ibtn{width:38px;height:38px}
.cbox textarea{flex:1;resize:none;max-height:160px;padding:11px 4px;font-size:15px;line-height:1.3;min-width:0}
.cbox textarea::placeholder{color:var(--fg2)}
.cbox .tbtn{height:38px}
.reqbar{border-top:1px solid var(--line);text-align:center;flex:none}
.reqbar p{padding:16px 24px;font-size:13px;color:var(--fg2);line-height:1.45}
.reqbar p b{color:var(--fg);font-weight:600}
.reqbar .opts{display:flex;border-top:1px solid var(--line)}
.reqbar .opts button{flex:1;height:48px;font-weight:600;font-size:14px}
.reqbar .opts button+button{border-left:1px solid var(--line)}
.reqbar .opts button:hover{background:var(--hover)}
.reqbar .opts .ok{color:var(--accent)}
.reqbar .opts .bad{color:var(--danger)}
.emoji-pop{position:absolute;left:16px;bottom:72px;width:332px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;z-index:20;animation:pop .14s ease}
.emoji-pop button{height:38px;border-radius:8px;font-size:22px}
.emoji-pop button:hover{background:var(--hover)}

.panel{width:360px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.panel-head{height:75px;flex:none;display:flex;align-items:center;padding:0 16px 0 24px;border-bottom:1px solid var(--line)}
.panel-head h3{flex:1;font-size:20px;font-weight:700}
.panel-body{flex:1;overflow-y:auto}
.psec{padding:12px 0;border-bottom:1px solid var(--line)}
.psec:last-child{border-bottom:0}
.psec h4{font-size:16px;font-weight:600;padding:8px 24px 10px;display:flex;align-items:center;justify-content:space-between}
.psec h4 button{font-size:14px;font-weight:600;color:var(--accent)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 24px;width:100%;text-align:left;font-size:14px;min-height:48px}
button.prow:hover,.prow.click:hover{background:var(--hover);cursor:pointer}
.prow .grow{flex:1;min-width:0}
.prow .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .s{font-size:12px;color:var(--fg2);margin-top:2px}
.prow .v{color:var(--fg2);font-size:14px;display:flex;align-items:center;gap:4px}
.prow .icon.md{color:var(--fg)}
.prow.danger{color:var(--danger);font-weight:600}
.prow.danger .icon{color:var(--danger)}
.tag{font-size:12px;color:var(--fg2);flex:none}
.note{font-size:12px;color:var(--fg2);line-height:1.5;padding:0 24px 10px}

.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
[data-theme="dark"] .switch{background:var(--line2)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .15s ease}
.sheet{width:100%;max-width:400px;max-height:min(700px,calc(100vh - 40px));background:var(--card);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;animation:pop .2s cubic-bezier(.2,.9,.3,1.05)}
.sheet.wide{max-width:548px}
.sheet-head{height:43px;flex:none;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:0 8px;border-bottom:1px solid var(--line)}
[data-theme="dark"] .sheet-head{border-color:var(--line2)}
.sheet-head h3{text-align:center;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .l{justify-self:start}
.sheet-head .r{justify-self:end;padding-right:8px}
.sheet-head .ibtn{width:32px;height:32px}
.sheet-body{overflow-y:auto;flex:1}
.actions{display:flex;flex-direction:column}
.actions button{min-height:48px;padding:4px 16px;font-size:14px;border-top:1px solid var(--line)}
[data-theme="dark"] .actions button{border-color:var(--line2)}
.actions button:first-child{border-top:0}
.actions button:hover{background:var(--hover)}
.actions .bad{color:var(--danger);font-weight:700}
.actions .ok{color:var(--accent);font-weight:700}
.dialog-text{padding:32px 32px 20px;text-align:center}
.dialog-text h3{font-size:20px;font-weight:400;margin-bottom:8px}
.dialog-text p{font-size:14px;color:var(--fg2);line-height:1.45}
.dialog-text+.actions button:first-child{border-top:1px solid var(--line)}
[data-theme="dark"] .dialog-text+.actions button:first-child{border-color:var(--line2)}
.to{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);min-height:48px}
[data-theme="dark"] .to{border-color:var(--line2)}
.to label{font-weight:600;font-size:16px;margin-right:8px}
.to input{flex:1;min-width:120px;height:32px;font-size:14px}
.to input::placeholder{color:var(--fg2)}
.chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.chip button{width:18px;height:18px;display:grid;place-items:center;color:var(--accent)}

.hero .title{font-size:20px;font-weight:600}

.hero input.title{text-align:center;width:100%;border-radius:8px;padding:4px 8px}

.seg{display:flex;background:var(--bg3);border-radius:8px;padding:2px;margin:0 24px 8px}
.seg button{flex:1;height:30px;border-radius:6px;font-size:13px;font-weight:600;color:var(--fg2)}

.selfview .avatar{background:#262626;color:#a8a8a8}

function stop() {
  if (S.call) endCall(true);
  [...S.subs, ...S.chatSubs.values(), ...S.peerSubs.values()].forEach(f => { try { f(); } catch (e) { } });
  if (S.msgOff) try { S.msgOff(); } catch (e) { }
  S.incoming.forEach(v => v.close?.());
  Object.assign(S, { user: null, profile: null, activeId: null, raw: [], view: [], subs: [], msgOff: null, replyTo: null, editing: null, drafts: {}, readMarked: {}, prefs: {}, blocks: {}, panel: false, tab: 'primary', ready: false });

  closeSheet(); closeMenu();
  document.title = 'Sup';
}

async function start(u) {
  if (S.user?.uid === u.uid) return;
  stop();
  S.user = u;
  let snap;
  try {
    await loadIdentity(u.uid);
    snap = await rdb.ref('users/' + u.uid).once('value');
  } catch (e) { renderNotice('Couldn’t load your account', esc(friendly(e)), () => { S.user = null; start(u); }); return; }
  if (S.user?.uid !== u.uid) return;
  if (!snap.exists()) renderWelcome(); else enter(snap.val());
}

    </form>

  </div></div>`;

  f.handle.oninput = () => { const v = f.handle.value.toLowerCase().replace(/[^a-z0-9_]/g, ''); if (v !== f.handle.value) f.handle.value = v; f.handle.dataset.touched = '1'; };

    const me = uid();
    let owner;
    try { owner = (await rdb.ref('handles/' + handle).once('value')).val(); }
    catch (ex) { err.textContent = friendly(ex); btn.disabled = false; return; }

    try {
      await rdb.ref('handles/' + handle).set(me);

}

function on(ref, ev, cb, errCb) {
  const fn = ref.on(ev, cb, errCb || (e => toast(friendly(e))));
  return () => ref.off(ev, fn);
}

  ref.onDisconnect().set({ online: false, lastSeen: SV }).then(() => ref.set({ online: true, lastSeen: SV })).catch(() => { });
}

  try {
    const cur = (await rdb.ref('keys/' + me).once('value')).val();
    if (!cur || cur.dh !== E.id.dhPub || cur.sig !== E.id.sigPub) await rdb.ref('keys/' + me).set({ dh: E.id.dhPub, sig: E.id.sigPub, at: SV });
  } catch (e) { toast(friendly(e)); }
  renderShell();
  S.subs.push(on(rdb.ref('users/' + me), 'value', s => { if (s.exists()) { S.profile = s.val(); renderRail(); renderListHead(); } }));
  S.subs.push(on(rdb.ref('prefs/' + me), 'value', s => {
    const was = !!S.prefs.hideActivity;
    S.prefs = s.val() || {};
    if (was !== !!S.prefs.hideActivity) writePresence();
    chatsChanged();
  }));
  S.subs.push(on(rdb.ref('blocks/' + me), 'value', s => { S.blocks = s.val() || {}; chatsChanged(); if (S.activeId) { renderComposerArea(); renderMessages(); } }));
  S.subs.push(on(rdb.ref('.info/connected'), 'value', s => { if (s.val()) writePresence(); }));
  const uc = rdb.ref('userChats/' + me);
  S.subs.push(on(uc, 'child_added', s => watchChat(s.key)));
  S.subs.push(on(uc, 'child_removed', s => unwatchChat(s.key, true)));
  const ring = rdb.ref('ringing/' + me);
  S.subs.push(on(ring, 'child_added', s => onRing(s.key, s.val())));
  S.subs.push(on(ring, 'child_removed', s => dismissIncoming(s.key)));
  setTimeout(() => { S.ready = true; }, 2500);
}

let chatsFrame = 0;
function chatsChanged() {
  if (chatsFrame || !S.user) return;
  chatsFrame = requestAnimationFrame(() => {
    chatsFrame = 0;
    renderRail(); renderList();
    const c = S.chats.get(S.activeId);
    if (c) { renderHeader(); renderBanner(); renderTyping(); if (receiptKey() !== S.receiptKey) renderMessages(); if (S.panel) renderPanel(); maybeMarkRead(); }
    updateTitle();
  });
}

function watchChat(id) {
  if (S.chatSubs.has(id)) return;
  S.chatSubs.set(id, on(rdb.ref('chats/' + id), 'value', s => {
    if (!s.exists()) { S.chats.delete(id); chatsChanged(); return; }
    const c = { id, ...s.val() }, prev = S.chats.get(id);
    S.chats.set(id, c);
    others(c).forEach(watchPeer);
    if (S.ready && prev && ms(c.updatedAt) > ms(prev.updatedAt) && c.lastMessage && c.lastMessage.senderId !== uid() && !c.lastMessage.system && !isMuted(c) && !isRequest(c) && (document.hidden || S.activeId !== id)) blip();
    if (S.activeId === id && prev && prev.crypto?.epoch !== c.crypto?.epoch) S.forceDecrypt = true;
    chatsChanged();
    if (S.activeId === id && S.forceDecrypt) { S.forceDecrypt = false; decryptView(); }
  }, () => unwatchChat(id, true)));
}
function unwatchChat(id, removed) {
  const off = S.chatSubs.get(id); if (off) { try { off(); } catch (e) { } }
  S.chatSubs.delete(id); S.chats.delete(id);
  if (removed && S.activeId === id) { closeChat(); toast('That conversation is no longer available.'); }
  chatsChanged();
}
function watchPeer(id) {
  if (!id || S.peerSubs.has(id)) return;
  const a = on(rdb.ref('status/' + id), 'value', s => { S.status.set(id, s.val() || {}); chatsChanged(); }, () => { });
  let first = true;
  const b = on(rdb.ref('keys/' + id), 'value', s => {
    const v = s.val(); if (!v) return;
    if (first) { first = false; if (!E.pub.has(id)) { const p = importPub(id, v); E.pub.set(id, p); p.catch(() => E.pub.delete(id)); } return; }
    E.pub.delete(id); E.pair.delete(id);
    [...E.keys.keys()].forEach(k => { if (k.endsWith('/d')) E.keys.delete(k); });
    const p = importPub(id, v); E.pub.set(id, p); p.catch(() => E.pub.delete(id));
  }, () => { });
  S.peerSubs.set(id, () => { a(); b(); });
}

function sysText(c, m) {
  const who = id => id === uid() ? 'You' : nameOf(c, id);
  const list = ids => (ids || []).map(who).join(', ');
  const by = who(m.senderId);
  switch (m.ev) {
    case 'created': return m.name ? `${by} created “${m.name}”` : `${by} created the group`;
    case 'added': return `${by} added ${list(m.who)}`;
    case 'removed': return `${by} removed ${list(m.who)}`;
    case 'banned': return `${by} banned ${list(m.who)}`;
    case 'left': return `${by} left the group`;
    case 'renamed': return m.name ? `${by} named the group “${m.name}”` : `${by} removed the group name`;
    case 'admin': return m.on ? `${by} made ${list(m.who)} an admin` : `${by} removed ${list(m.who)} as admin`;
    case 'ttl': return m.ttl ? `${by} turned on disappearing messages (${(TTLS.find(t => t[0] === m.ttl) || [, ''])[1]})` : `${by} turned off disappearing messages`;
    case 'call': return m.missed ? `Missed ${m.kind === 'audio' ? 'audio' : 'video'} call` : `${m.kind === 'audio' ? 'Audio' : 'Video'} call · ${dur(m.secs || 0)}`;
    default: return m.text ? String(m.text) : 'Update';
  }
}

function previewOf(c) {
  const lm = c.lastMessage;
  if (!lm) return isRequest(c) ? 'Wants to send you a message' : c.type === 'group' ? 'New group' : 'Say hi';
  if (lm.system) return sysText(c, lm);
  if (lm.unsent) return lm.senderId === uid() ? 'You unsent a message' : 'Unsent a message';
  if (lm.exp && lm.exp < now()) return 'Message disappeared';
  if (isBlocked(lm.senderId)) return 'Blocked';
  const pre = lm.senderId === uid() ? 'You: ' : c.type === 'group' ? firstName(nameOf(c, lm.senderId)) + ': ' : '';
  const k = c.id + ':' + lm.iv;
  if (E.preview.has(k)) { const v = E.preview.get(k); return v === null ? pre + 'Encrypted message' : pre + v; }
  E.preview.set(k, undefined);
  keyFor(c, lm.e).then(key => unseal(key, lm, `${c.id}|last|${lm.senderId}`)).then(v => E.preview.set(k, String(v.t || ''))).catch(() => E.preview.set(k, null)).finally(() => chatsChanged());
  return pre + '…';
}

    S.raw = out; S.full = s.numChildren() < 400; S.loaded = true;
    decryptView();
  }, e => { if (S.activeId === id) toast(friendly(e)); });
  if (S.panel) renderPanel();

async function openMsg(c, m) {
  if (m.type === 'system') return { ...m, sys: true };
  const k = `${c.id}|${m.id}|${m.iv}`;
  let p = E.plain.get(k);
  if (!p) {
    p = (async () => {
      try {
        const key = await keyFor(c, m.e);
        const v = await unseal(key, m, `${c.id}|${m.id}|${m.senderId}`);
        const sigOk = await verifyStr(m.senderId, `${c.id}|${m.id}|${m.senderId}|${m.iv}|${m.ct}`, m.sig || '');
        return { ok: true, text: String(v.t ?? ''), reply: v.r || null, sigOk };
      } catch (e) { setTimeout(() => E.plain.delete(k), 4000); return { ok: false }; }
    })();
    E.plain.set(k, p);
  }
  return { ...m, ...(await p) };
}
async function decryptView() {
  const c = S.chats.get(S.activeId); if (!c) return;
  const gen = ++S.gen, raw = S.raw;
  const out = await Promise.all(raw.map(m => openMsg(c, m)));
  if (gen !== S.gen || S.activeId !== c.id) return;
  S.view = out;
  renderMessages();
  maybeMarkRead();
  if (out.some(m => !m.sys && !m.ok)) setTimeout(() => { if (S.activeId === c.id && gen === S.gen) decryptView(); }, 4500);
}

function renderMessages() {
  const box = $('.msgs'), list = $('.mlist'); if (!box || !list) return;
  const c = S.chats.get(S.activeId); if (!c) return;
  S.receiptKey = receiptKey();
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  const me = uid(), group = c.type === 'group', msgs = S.view, gap = 20 * 60e3;
  let html = '';
  if (S.full !== false) {
    const p = peer(c), u = p && S.users.get(p);
    html += `<div class="intro">${chatAvatar(c, 96)}<div class="n">${esc(chatTitle(c))}</div><div class="h">${group ? `${members(c).length} members` : u?.handle ? '@' + esc(u.handle) + ' · Sup' : 'Sup'}</div><div class="e2e">${icon('lock')}Messages and calls are end-to-end encrypted</div>${group ? '' : `<button class="btn" data-verify="${esc(p)}">View security code</button>`}</div>`;
  }
  if (!S.loaded) html += '<div style="display:grid;place-items:center;padding:24px"><div class="spinner"></div></div>';
  let prev = null;
  const lastMine = [...msgs].reverse().find(m => m.senderId === me && !m.sys);
  msgs.forEach((m, i) => {
    const t = ms(m.createdAt), next = msgs[i + 1];
    if (!prev || t - ms(prev.createdAt) > gap) html += `<div class="sep">${timeSep(t || now())}</div>`;
    if (m.sys) { html += `<div class="sys">${m.ev === 'call' ? icon(m.kind === 'audio' ? 'phone' : 'video') : ''}${esc(sysText(c, m))}</div>`; prev = m; return; }
    const brk = x => !x || x.sys || x.senderId !== m.senderId;
    const first = brk(prev) || t - ms(prev.createdAt) > gap;
    const last = brk(next) || ms(next.createdAt) - t > gap;
    const mine = m.senderId === me;
    const hidden = !mine && isBlocked(m.senderId) && !S.revealed.has(m.id);
    const reacts = Object.entries(m.reactions || {}).map(([k, v]) => [k, keys(v)]).filter(([k, v]) => RX[k] && v.length);
    const big = m.ok && !hidden && isEmojiOnly(m.text);
    html += `<div class="row ${mine ? 'me' : 'them'}${first ? ' first' : ''}${last ? ' last' : ''}${S.pending.has(m.id) ? ' pending' : ''}" data-id="${esc(m.id)}">`;
    if (!mine) html += `<div class="av">${last ? avatarHTML(nameOf(c, m.senderId), 28) : ''}</div>`;
    html += `<div class="stack">`;
    if (!mine && group && first) html += `<div class="sender">${esc(nameOf(c, m.senderId))}</div>`;
    if (m.ok && m.reply && !hidden) {
      const rn = m.reply.s === me ? 'you' : firstName(nameOf(c, m.reply.s));
      html += `<div class="reply-label">${icon('reply', 'xs')}${mine ? `You replied to ${esc(rn)}` : `${esc(firstName(nameOf(c, m.senderId)))} replied to ${esc(rn === 'you' ? 'you' : rn)}`}</div><div class="reply-quote" data-to="${esc(m.reply.id)}">${esc(clip(m.reply.t, 70))}</div>`;
    }
    const title = esc(new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }));
    if (hidden) html += `<div class="bubble na hid" title="Click to show">${icon('block')}Message from someone you blocked</div>`;
    else if (!m.ok) html += `<div class="bubble na" title="${title}">${icon('lock')}Message unavailable</div>`;
    else html += `<div class="bubble${big ? ' big' : ''}" title="${title}">${linkify(m.text)}</div>`;
    if (reacts.length) html += `<div class="reacts">${reacts.map(([k, v]) => `<button class="react-pill${v.includes(me) ? ' mine' : ''}" data-k="${k}" title="${esc(v.map(id => id === me ? 'You' : firstName(nameOf(c, id))).join(', '))}">${RX[k]}${v.length > 1 ? `<span>${v.length}</span>` : ''}</button>`).join('')}</div>`;
    const notes = [];
    if (m.editedAt && m.ok) notes.push('Edited');
    if (m.exp) notes.push(icon('timer', 'xs'));
    if (m.ok && m.sigOk === false) notes.push(`${icon('alert', 'xs')}Unverified sender`);
    if (notes.length) html += `<div class="meta">${notes.join(' ')}</div>`;
    if (lastMine && m.id === lastMine.id) html += `<div class="receipt">${esc(receiptFor(c, m))}</div>`;
    html += `</div>`;

function receiptFor(c, m) {
  if (S.pending.has(m.id)) return 'Sending…';
  const t = ms(m.createdAt), o = others(c);

  if (c.type !== 'group') return read.length ? 'Seen' : 'Sent';
  if (!read.length) return 'Sent';
  if (read.length === o.length) return 'Seen by everyone';
  return `Seen by ${read.map(id => firstName(nameOf(c, id))).slice(0, 3).join(', ')}${read.length > 3 ? ` +${read.length - 3}` : ''}`;
}

async function sealMessage(c, id, payload, preview) {
  const me = uid(), { e, key } = await sendKey(c);
  const box = await seal(key, payload, `${c.id}|${id}|${me}`);
  const sig = await signStr(`${c.id}|${id}|${me}|${box.iv}|${box.ct}`);
  const last = await seal(key, { t: clip(preview, 120) }, `${c.id}|last|${me}`);
  E.plain.set(`${c.id}|${id}|${box.iv}`, Promise.resolve({ ok: true, text: payload.t, reply: payload.r || null, sigOk: true }));
  E.preview.set(c.id + ':' + last.iv, clip(preview, 120));
  return { e, box, sig, last };
}

async function send(override) {
  const ta = $('.cbox textarea'), c = S.chats.get(S.activeId); if (!c) return;
  const text = String(override ?? ta?.value ?? '').trim(); if (!text) return;
  if (c.type !== 'group' && isBlocked(peer(c))) return;
  const me = uid(), base = `chats/${c.id}/`;
  if (S.editing && override == null) {
    const m = S.editing;
    S.editing = null; ta.value = S.editDraft || ''; S.editDraft = ''; renderCtx(); ta.dispatchEvent(new Event('input'));
    if (text === m.text) return;
    try {
      const { e, box, sig, last } = await sealMessage(c, m.id, m.reply ? { t: text, r: m.reply } : { t: text }, text);
      const p = `messages/${c.id}/${m.id}/`;
      const upd = { [p + 'e']: e, [p + 'iv']: box.iv, [p + 'ct']: box.ct, [p + 'sig']: sig, [p + 'editedAt']: SV };
      if (S.raw[S.raw.length - 1]?.id === m.id) upd[base + 'lastMessage'] = { senderId: me, e, iv: last.iv, ct: last.ct, ...(m.exp ? { exp: m.exp } : {}) };
      await rdb.ref().update(upd);
    } catch (err) { toast(friendly(err)); }
    return;
  }
  const reply = S.replyTo ? { id: S.replyTo.id, t: clip(S.replyTo.text, 140), s: S.replyTo.senderId } : null;
  if (override == null && ta) { ta.value = ''; S.drafts[c.id] = ''; ta.dispatchEvent(new Event('input')); }
  S.replyTo = null; S.typingSentAt = 0; renderCtx();
  const id = rdb.ref('messages/' + c.id).push().key;
  S.pending.add(id); S.forceBottom = true;
  try {
    const { e, box, sig, last } = await sealMessage(c, id, reply ? { t: text, r: reply } : { t: text }, text);
    const msg = { senderId: me, createdAt: SV, e, iv: box.iv, ct: box.ct, sig };
    const ttl = ms(c.ttl); if (ttl) msg.exp = now() + ttl;
    const upd = {
      [`messages/${c.id}/${id}`]: msg,
      [base + 'lastMessage']: { senderId: me, e, iv: last.iv, ct: last.ct, ...(ttl ? { exp: msg.exp } : {}) },
      [base + 'updatedAt']: SV,
      [base + 'typing/' + me]: null
    };
    if (!c.accepted?.[me]) upd[base + 'accepted/' + me] = true;
    if (S.prefs.noReceipts) upd[`prefs/${me}/read/${c.id}`] = SV; else upd[base + 'lastRead/' + me] = SV;
    if (c.type !== 'group') upd[`userChats/${peer(c)}/${c.id}`] = true;
    const p = rdb.ref().update(upd);
    p.then(() => { S.pending.delete(id); if (S.activeId === c.id) renderMessages(); }).catch(err => {
      S.pending.delete(id);
      toast(/permission/i.test(String(err?.message || err?.code)) ? 'Message not delivered.' : friendly(err));
      if (override == null && ta && !ta.value) { ta.value = text; ta.dispatchEvent(new Event('input')); }
    });
  } catch (err) { S.pending.delete(id); toast(friendly(err)); if (override == null && ta && !ta.value) { ta.value = text; ta.dispatchEvent(new Event('input')); } }
}

  $('[data-code]', p)?.addEventListener('click', () => openSecurityCode(o));
  $('[data-epoch]', p)?.addEventListener('click', () => openGroupSecurity(c));
  $('[data-add]', p)?.addEventListener('click', () => openAddPeople(c.id));
  $$('[data-member]', p).forEach(r => r.onclick = () => openMemberActions(c, r.dataset.member));

function openMemberActions(c, id) {
  const me = uid();
  if (id === me) return;
  const admin = c.type === 'group' && !!c.admins?.[me], isAdm = !!c.admins?.[id], name = nameOf(c, id);
  const acts = [['msg', 'Message'], ['code', 'View security code']];
  if (admin) acts.push(['admin', isAdm ? 'Remove as admin' : 'Make admin'], ['remove', 'Remove from group', 'bad'], ['ban', 'Ban from group', 'bad']);
  acts.push(['block', isBlocked(id) ? 'Unblock' : 'Block', 'bad']);
  closeSheet();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet"><div class="hero">${avatarHTML(name, 64, online(id))}<div class="title">${esc(name)}</div><div class="sub" data-h></div></div><div class="actions">${acts.map(([k, l, cls]) => `<button data-k="${k}" class="${cls || ''}">${esc(l)}</button>`).join('')}<button data-k="cancel">Cancel</button></div></div>`;
  document.body.appendChild(scrim);
  $('.actions button', scrim).style.borderTop = '1px solid var(--line)';
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeSheet(); });
  getUser(id).then(u => { const el = $('[data-h]', scrim); if (el && u.handle) el.textContent = '@' + u.handle; });
  $$('[data-k]', scrim).forEach(b => b.onclick = async () => {

      else if (k === 'remove') confirmDialog(`Remove ${firstName(name)}?`, `${name} won’t be able to read new messages in this group.`, 'Remove', () => removeMember(c, id, false));

      else if (k === 'block') isBlocked(id) ? await setBlock(id, false, name) : confirmDialog(`Block ${name}?`, 'They won’t be able to message or call you, or add you to groups.', 'Block', () => setBlock(id, true, name));
    } catch (e) { toast(friendly(e)); }

function removeMember(c, id, ban) {
  const base = `chats/${c.id}/`;
  const upd = {
    ...postSystem(c.id, ban ? 'banned' : 'removed', { who: [id] }),
    [base + 'members/' + id]: null, [base + 'admins/' + id]: null, [base + 'typing/' + id]: null, [base + 'accepted/' + id]: null, [base + 'addedBy/' + id]: null,
    [`userChats/${id}/${c.id}`]: null
  };
  if (ban) upd[base + 'bans/' + id] = true;
  return rdb.ref().update(upd);
}

async function setBlock(id, val, name) {
  await rdb.ref(`blocks/${uid()}/${id}`).set(val ? true : null);
  toast(val ? `${name || 'They'} ${name ? 'is' : 'are'} blocked.` : `${name || 'They'} ${name ? 'is' : 'are'} unblocked.`);
}

async function deleteChat(c) {
  if (c.type === 'group') return leaveGroup(c.id);
  const me = uid();
  await rdb.ref().update({ [`userChats/${me}/${c.id}`]: null, [`prefs/${me}/cleared/${c.id}`]: SV, [`prefs/${me}/mute/${c.id}`]: null });
  if (S.activeId === c.id) closeChat();
}

async function leaveGroup(id) {
  const c = S.chats.get(id); if (!c) return;
  const me = uid(), rest = others(c), base = `chats/${id}/`;
  const upd = {
    ...postSystem(id, 'left'),
    [base + 'members/' + me]: null, [base + 'admins/' + me]: null, [base + 'typing/' + me]: null, [base + 'lastRead/' + me]: null, [base + 'accepted/' + me]: null, [base + 'addedBy/' + me]: null,
    [`userChats/${me}/${id}`]: null
  };
  if (c.admins?.[me] && !keys(c.admins).some(a => a !== me) && rest.length) upd[base + 'admins/' + rest[0]] = true;
  if (S.activeId === id) closeChat();
  await rdb.ref().update(upd);
}

async function searchUsers(q) {
  q = q.trim().toLowerCase().replace(/^@/, ''); if (!q) return [];
  const users = rdb.ref('users'), out = new Map();
  const res = await Promise.allSettled([
    users.orderByChild('handle').startAt(q).endAt(q + '').limitToFirst(10).once('value'),
    users.orderByChild('nameLower').startAt(q).endAt(q + '').limitToFirst(10).once('value')
  ]);
  res.forEach(r => r.status === 'fulfilled' && r.value.forEach(d => { if (d.key !== uid() && !isBlocked(d.key)) out.set(d.key, { id: d.key, ...d.val() }); }));
  if (res.every(r => r.status === 'rejected')) throw res[0].reason;
  return [...out.values()].sort((a, b) => (b.handle === q) - (a.handle === q));
}
function knownPeople(exclude = []) {
  const seen = new Map();
  sortedChats().filter(c => !isRequest(c)).forEach(c => others(c).forEach(id => { if (!seen.has(id) && !exclude.includes(id) && !isBlocked(id)) seen.set(id, { id, name: nameOf(c, id) }); }));
  return [...seen.values()].slice(0, 30);
}
function getUser(id) {
  const c = S.users.get(id); if (c && !c.then) return Promise.resolve(c);
  if (S.users.has('p:' + id)) return S.users.get('p:' + id);
  const p = rdb.ref('users/' + id).once('value').then(d => { const u = d.exists() ? { id, ...d.val() } : { id, name: 'Unknown' }; S.users.set(id, u); return u; }).catch(() => ({ id, name: 'Unknown' }));
  S.users.set('p:' + id, p);
  return p;
}

function peoplePicker(sheet, { exclude = [], onChange, initial = [] }) {
  const sel = new Map();
  const to = $('.to', sheet), input = $('.to input', sheet), results = $('.results', sheet);
  let timer, token = 0, shown = [], cursor = 0;
  const personRow = (p, i) => `<div class="person${sel.has(p.id) ? ' on' : ''}${i === cursor ? ' cur' : ''}" data-id="${esc(p.id)}">${avatarHTML(p.name, 44, online(p.id))}<div class="t"><div>${esc(p.name)}</div><div class="s" data-h="${esc(p.id)}">${p.handle ? '@' + esc(p.handle) : ''}</div></div><div class="check">${icon('check')}</div></div>`;
  const pick = p => {
    if (sel.has(p.id)) sel.delete(p.id); else sel.set(p.id, p);
    drawChips(); onChange([...sel.values()]);
    if (input.value) { input.value = ''; run(); } else draw(shown, results.dataset.label);
    input.focus();
  };
  const draw = (people, label) => {
    shown = people; results.dataset.label = label; cursor = Math.min(cursor, Math.max(0, people.length - 1));
    results.innerHTML = people.length ? `<div class="section">${esc(label)}</div>` + people.map(personRow).join('') : `<div class="hint">${input.value.trim() ? 'No account found.' : 'Search by name or @username.'}</div>`;
    $$('.person', results).forEach(el => el.onclick = () => pick(shown.find(x => x.id === el.dataset.id)));
    people.filter(p => !p.handle).forEach(async p => { const u = await getUser(p.id); const el = $(`[data-h="${CSS.escape(p.id)}"]`, results); if (el && u.handle) el.textContent = '@' + u.handle; p.handle = u.handle; });
  };
  const drawChips = () => {
    $$('.chip', to).forEach(c => c.remove());
    [...sel.values()].forEach(p => {
      const chip = document.createElement('span'); chip.className = 'chip';
      chip.innerHTML = `${esc(firstName(p.name) || p.name)}<button title="Remove">${icon('x', 'xs')}</button>`;
      $('button', chip).onclick = () => { sel.delete(p.id); drawChips(); draw(shown, results.dataset.label); onChange([...sel.values()]); input.focus(); };
      to.insertBefore(chip, input);
    });
  };
  const run = () => {
    const q = input.value.trim(), my = ++token; cursor = 0;
    clearTimeout(timer);
    if (!q) { draw(knownPeople(exclude), 'Suggested'); return; }
    timer = setTimeout(async () => {
      try { const r = (await searchUsers(q)).filter(p => !exclude.includes(p.id)); if (my === token) draw(r, 'Accounts'); }
      catch (e) { if (my === token) results.innerHTML = `<div class="hint">${esc(friendly(e))}</div>`; }
    }, 160);
  };
  initial.forEach(p => sel.set(p.id, p));
  if (initial.length) { drawChips(); onChange([...sel.values()]); }
  input.oninput = run;
  input.onkeydown = e => {
    if (e.key === 'Backspace' && !input.value && sel.size) { sel.delete([...sel.keys()].pop()); drawChips(); draw(shown, results.dataset.label); onChange([...sel.values()]); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!shown.length) return; cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length; $$('.person', results).forEach((el, i) => el.classList.toggle('cur', i === cursor)); $$('.person', results)[cursor]?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { e.preventDefault(); if (input.value.trim() && shown[cursor]) pick(shown[cursor]); else if (!input.value.trim() && sel.size) $('.sheet-foot .btn')?.click(); }
  };
  run();
  input.focus();
  return sel;
}

function openCompose(prefill) {

async function openDirect(p) {
  const me = uid(), [a, b] = [me, p.id].sort(), id = `d_${a}_${b}`;
  if (isBlocked(p.id)) { toast(`You blocked ${p.name}. Unblock them to chat.`); return; }
  let exists = S.chats.has(id);
  if (!exists) { try { exists = (await rdb.ref(`chats/${id}/type`).once('value')).exists(); } catch (e) { exists = false; } }
  if (!exists) {
    try {
      await pubKeys(p.id);
    } catch (e) { throw new Error(`${p.name} needs to open Sup again to set up encryption.`); }
    try {
      await rdb.ref().update({
        [`chats/${id}`]: { type: 'direct', peers: { a, b }, members: { [me]: true, [p.id]: true }, names: { [me]: myName(), [p.id]: p.name }, accepted: { [me]: true }, createdBy: me, createdAt: SV, updatedAt: SV },
        [`userChats/${me}/${id}`]: true,
        [`userChats/${p.id}/${id}`]: true
      });
    } catch (e) { throw /permission/i.test(String(e?.message || e?.code)) ? new Error('You can’t message this account.') : e; }
  } else if (!S.chats.has(id)) {
    await rdb.ref().update({ [`userChats/${me}/${id}`]: true, [`prefs/${me}/cleared/${id}`]: null });
  }
  watchChat(id);
  openChat(id);
}

async function createGroup(name, people) {
  const me = uid(), id = rdb.ref('chats').push().key;
  await rdb.ref().update({
    [`chats/${id}`]: { type: 'group', name, members: { [me]: true }, admins: { [me]: true }, names: { [me]: myName() }, accepted: { [me]: true }, createdBy: me, createdAt: SV, updatedAt: SV },
    [`userChats/${me}/${id}`]: true
  });
  await rdb.ref().update(postSystem(id, 'created', { name }));
  const added = await addPeople(id, people, true);
  watchChat(id);
  openChat(id);
  if (added.length < people.length) toast(`Couldn’t add ${people.length - added.length} ${people.length - added.length === 1 ? 'person' : 'people'}.`);
}

async function addPeople(chatId, people, quiet) {
  const me = uid(), base = `chats/${chatId}/`, ok = [];
  for (const p of people) {
    try {
      await rdb.ref().update({ [base + 'members/' + p.id]: true, [base + 'names/' + p.id]: p.name, [base + 'addedBy/' + p.id]: me, [`userChats/${p.id}/${chatId}`]: true });
      ok.push(p);
    } catch (e) { }
  }
  if (ok.length) await rdb.ref().update(postSystem(chatId, 'added', { who: ok.map(p => p.id) }));
  if (!quiet && ok.length < people.length) toast(`Couldn’t add ${people.length - ok.length} ${people.length - ok.length === 1 ? 'person' : 'people'}.`);
  return ok;
}

function openAddPeople(chatId) {

  };
}

  if (mini) $('span', mini).textContent = call.joinedAny ? `On call · ${dur((Date.now() - call.startedAt) / 1000)}` : 'Calling…';
}

function layoutStage(call) {
  const stage = $('.stage'); if (!stage) return;
  const n = call.peers.size;
  stage.style.gridTemplateColumns = `repeat(${n <= 1 ? 1 : n <= 4 ? 2 : 3}, 1fr)`;
  stage.style.gridAutoRows = '1fr';
}

function renderCallUI() {
  const call = S.call; if (!call) return;
  $('.call')?.remove();
  const c = S.chats.get(call.chatId), title = c ? chatTitle(c) : 'Call';
  const el = document.createElement('div'); el.className = 'call';
  el.innerHTML = `
    <div class="call-top">${c ? chatAvatar(c, 40) : ''}<div class="t"><div class="n">${esc(title)}</div><div class="s">${icon('lock')}End-to-end encrypted · <span data-status>…</span><span class="bars q4"><i></i><i></i><i></i><i></i></span></div></div><button class="ibtn" data-min title="Minimize">${icon('minimize', 'md')}</button></div>
    <div class="stage"></div>
    <div class="ringing">${c ? chatAvatar(c, 120).replace('class="avatar', 'class="avatar pulse') : ''}<div class="n">${esc(title)}</div><div class="st">${call.outgoing ? (call.kind === 'audio' ? 'Calling…' : 'Video calling…') : 'Connecting…'}</div></div>
    <div class="selfview${call.cam ? '' : ' hidden'}"><video autoplay muted playsinline></video><div class="tag">You</div></div>
    <div class="callbar">
      <button class="cbtn" data-mic title="Mute">${icon('mic')}</button>
      <button class="cbtn" data-cam title="Camera">${icon(call.cam ? 'video' : 'videoOff')}</button>
      <button class="cbtn end" data-end title="End call">${icon('hangup')}</button>
    </div>`;
  document.body.appendChild(el);
  const vid = $('.selfview video', el);
  vid.srcObject = call.stream; call.localVideo = vid; vid.play?.().catch(() => { });
  const stage = $('.stage', el);
  call.peers.forEach(p => stage.appendChild(p.tile));
  layoutStage(call);
  const micBtn = $('[data-mic]', el), camBtn = $('[data-cam]', el);
  const sync = () => {
    micBtn.classList.toggle('off', !call.mic); micBtn.innerHTML = icon(call.mic ? 'mic' : 'micOff'); micBtn.title = call.mic ? 'Mute' : 'Unmute';
    camBtn.classList.toggle('off', !call.cam); camBtn.innerHTML = icon(call.cam ? 'video' : 'videoOff'); camBtn.title = call.cam ? 'Turn camera off' : 'Turn camera on';
    $('.selfview', el).classList.toggle('hidden', !call.cam);
  };
  sync();
  micBtn.onclick = () => {
    call.mic = !call.mic;
    call.stream.getAudioTracks().forEach(t => t.enabled = call.mic);
    call.base.child(`participants/${uid()}/mic`).set(call.mic).catch(() => { });
    sync();
  };
  camBtn.onclick = async () => {
    if (call.cam) {
      call.cam = false;
      call.stream.getVideoTracks().forEach(t => t.enabled = false);
      call.vRef.set({ off: true, s: call.seqV++ }).catch(() => { });
    } else {
      if (!call.stream.getVideoTracks().length) {
        try { const s = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24 } } }); s.getVideoTracks().forEach(t => call.stream.addTrack(t)); vid.srcObject = null; vid.srcObject = call.stream; vid.play?.().catch(() => { }); }
        catch (e) { toast(friendly(e)); return; }
      }
      call.stream.getVideoTracks().forEach(t => t.enabled = true);
      call.cam = true; videoLoop(call);
    }
    call.base.child(`participants/${uid()}/cam`).set(call.cam).catch(() => { });
    sync();
  };
  $('[data-end]', el).onclick = () => endCall(false, 'hangup');
  $('[data-min]', el).onclick = minimizeCall;
  $('.minicall')?.remove();
  call.min = false;
}
function minimizeCall() {
  const call = S.call; if (!call) return;
  $('.call')?.classList.add('hidden');
  call.min = true;
  if (!$('.minicall')) {
    const m = document.createElement('div'); m.className = 'minicall';
    m.innerHTML = `${icon(call.kind === 'audio' ? 'phone' : 'video')}<span>On call</span>`;
    m.onclick = showCall;
    document.body.appendChild(m);
  }
}
function showCall() { if (!S.call) return; $('.call')?.classList.remove('hidden'); $('.minicall')?.remove(); S.call.min = false; }

async function endCall(silent, reason) {
  const call = S.call; if (!call || call.ended) return;
  call.ended = true; call.active = false; S.call = null;
  call.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
  call.subs.forEach(f => { try { f(); } catch (e) { } });
  [...call.peers.keys()].forEach(p => removePeer(call, p));
  call.stream.getTracks().forEach(t => t.stop());
  (call.audioNodes || []).forEach(n => { try { n.disconnect(); } catch (e) { } });
  if (call.audioNodes?.[1]) call.audioNodes[1].onaudioprocess = null;
  try { call.ac?.close(); } catch (e) { }
  $('.call')?.remove(); $('.minicall')?.remove();
  if (!S.user) return;
  const me = uid(), base = call.base;
  base.child('participants/' + me).onDisconnect().cancel().catch(() => { });
  rdb.ref(`callMedia/${call.id}/${me}`).onDisconnect().cancel().catch(() => { });
  rdb.ref(`callMedia/${call.id}/${me}`).remove().catch(() => { });
  await base.child('participants/' + me).remove().catch(() => { });
  const remaining = keys(call.data?.participants).filter(x => x !== me);
  if (reason !== 'ended' && (!call.group || !remaining.length)) {
    const res = await base.child('state').transaction(s => s === 'ended' ? undefined : 'ended').catch(() => null);
    if (res?.committed) {
      base.child('endedAt').set(SV).catch(() => { });
      const missed = !call.joinedAny;
      rdb.ref().update(postSystem(call.chatId, 'call', missed ? { kind: call.kind, missed: true } : { kind: call.kind, secs: Math.round((Date.now() - call.startedAt) / 1000) })).catch(() => { });
      if (call.outgoing) keys(call.data?.members).filter(m => m !== me).forEach(m => rdb.ref(`ringing/${m}/${call.id}`).remove().catch(() => { }));
    }
  }
  if (!silent) {
    const msg = { noanswer: 'No answer.', declined: 'Call declined.', left: 'Call ended.', ended: 'Call ended.' }[reason];
    if (msg) toast(msg);
  }
  tone([523, 392], .14, .05);
}
window.addEventListener('beforeunload', () => { if (S.call) endCall(true); });

function moveChat(dir) {
  const list = $$('.list .item'); if (!list.length) return;
  const i = list.findIndex(el => el.dataset.id === S.activeId);
  const n = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + dir));
  openChat(list[n].dataset.id);
  list[n].scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.menu')) { closeMenu(); return; } if ($('.scrim')) { closeSheet(); return; } if ($('.emoji-pop')) { $('.emoji-pop').remove(); return; } if (S.panel) { togglePanel(); return; } }
  if (!S.profile || !$('.rail') || (S.call && !S.call.min)) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.code === 'KeyK') { e.preventDefault(); closeSheet(); $('.search input')?.focus(); }
  else if (e.altKey && !mod && e.code === 'KeyN') { e.preventDefault(); openCompose(); }
  else if (mod && e.code === 'KeyI' && S.activeId) { e.preventDefault(); togglePanel(); }
  else if (e.altKey && !$('.scrim') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); moveChat(e.key === 'ArrowUp' ? -1 : 1); }
});
</script>
</body>
</html>
