<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<meta name="color-scheme" content="light dark">
<title>A1</title>
<style>

:root{
  --bg:#ffffff;--bg2:#f5f5f7;--bg3:#e8e8ed;--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#a1a1a6;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--hover:rgba(0,0,0,.04);--sel:rgba(0,0,0,.065);
  --me:#1d1d1f;--me-fg:#ffffff;--them:#ebebed;--them-fg:#1d1d1f;
  --glass:rgba(255,255,255,.8);--scrim:rgba(0,0,0,.28);
  --avatar:#c7c7cc;--avatar-fg:#ffffff;--btn:#1d1d1f;--btn-fg:#ffffff;
  --shadow:0 12px 48px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.1);
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#000000;--bg2:#1c1c1e;--bg3:#2c2c2e;--fg:#f5f5f7;--fg2:#98989d;--fg3:#636366;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);
  --me:#f5f5f7;--me-fg:#000000;--them:#262628;--them-fg:#f5f5f7;
  --glass:rgba(22,22,24,.78);--scrim:rgba(0,0,0,.5);
  --avatar:#48484a;--avatar-fg:#f5f5f7;--btn:#f5f5f7;--btn-fg:#000000;
  --shadow:0 12px 48px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
::selection{background:var(--fg);color:var(--bg)}
svg{display:block}
.hidden{display:none!important}

.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:background .15s}
.ibtn:hover{background:var(--hover)}
.ibtn:active{background:var(--sel)}

.avatar{flex:none;border-radius:50%;background:var(--avatar);color:var(--avatar-fg);display:grid;place-items:center;font-weight:600;letter-spacing:.02em;user-select:none;position:relative}
.avatar.group{background:none}
.avatar.group span{position:absolute;border-radius:50%;background:var(--avatar);color:var(--avatar-fg);display:grid;place-items:center;font-weight:600;box-shadow:0 0 0 2px var(--bg)}

#app{height:100%;display:flex;min-width:860px}
html,body{min-width:860px}

.center{flex:1;display:grid;place-items:center;padding:24px;overflow:auto}
.auth{width:100%;max-width:340px;text-align:center}
.mark{font-size:44px;font-weight:700;letter-spacing:-.04em;margin-bottom:6px}
.auth h2{font-size:17px;font-weight:500;color:var(--fg2);margin-bottom:32px}
.field{display:block;width:100%;height:46px;padding:0 16px;border-radius:12px;background:var(--bg2);font-size:16px;margin-bottom:10px;border:1px solid transparent;transition:border-color .15s,background .15s}
.field:focus{border-color:var(--line2);background:var(--bg)}
.primary{width:100%;height:46px;border-radius:12px;background:var(--btn);color:var(--btn-fg);font-weight:600;font-size:16px;margin-top:8px;transition:opacity .15s}
.primary:disabled{opacity:.35;cursor:default}
.primary:not(:disabled):active{opacity:.8}
.link{color:var(--fg);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.auth .alt{margin-top:22px;color:var(--fg2);font-size:14px}
.auth .err{min-height:20px;font-size:13px;color:var(--fg);margin:6px 0 2px}
.auth .forgot{margin-top:14px;font-size:13px;color:var(--fg2)}
.notice{max-width:460px;text-align:center}
.notice p{color:var(--fg2);margin-top:10px}
.notice h2{font-size:17px;font-weight:600;margin-top:10px;color:var(--fg)}
.notice .pill{margin-top:22px}
.notice code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;background:var(--bg2);padding:2px 6px;border-radius:6px;color:var(--fg)}

.side{width:320px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.side-head{padding:14px 14px 8px;display:flex;align-items:center;gap:6px}
.side-head h1{flex:1;font-size:26px;font-weight:700;letter-spacing:-.025em;padding-left:4px}
.me-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.search{margin:0 14px 8px;height:36px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--fg2)}
.search .icon{width:16px;height:16px}
.search input{flex:1;height:100%;color:var(--fg);font-size:15px}
.search input::placeholder{color:var(--fg2)}
.list{flex:1;overflow-y:auto;padding:2px 8px 16px}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px 9px 8px;border-radius:12px;cursor:pointer;position:relative;user-select:none}
.item:hover{background:var(--hover)}
.item.active{background:var(--sel)}
.item .dot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent}
.item.unread .dot{background:var(--fg)}
.item .body{flex:1;min-width:0}
.item .top{display:flex;align-items:baseline;gap:8px}
.item .name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .time{font-size:13px;color:var(--fg2);flex:none}
.item .preview{color:var(--fg2);font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px;word-break:break-word}
.item.unread .preview{color:var(--fg)}
.empty{padding:48px 24px;text-align:center;color:var(--fg2)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px;font-weight:600}
.pill{width:auto;padding:0 20px;height:38px;font-size:15px;border-radius:19px}
.empty .primary{width:auto;padding:0 20px;height:38px;font-size:15px;margin-top:18px;border-radius:19px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.placeholder{flex:1;display:grid;place-items:center;color:var(--fg3);font-size:15px}
.chead{position:absolute;top:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 10px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.chead .who{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;justify-self:center;max-width:100%;padding:2px 10px;border-radius:10px}
.chead .who:hover{background:var(--hover)}
.chead .who .n{font-size:12px;font-weight:500;display:flex;align-items:center;gap:2px;max-width:100%}
.chead .who .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .who .n .icon{width:11px;height:11px;color:var(--fg3);flex:none}
.chead .who .s{font-size:11px;color:var(--fg2);margin-top:-2px}
.chead .info{justify-self:end}

.msgs{flex:1;overflow-y:auto;padding:86px 16px 12px;display:flex;flex-direction:column}
.msgs .spacer{flex:1}
.sep{text-align:center;font-size:11.5px;color:var(--fg2);margin:18px 0 8px;font-weight:500}
.sep b{font-weight:600;color:var(--fg2)}
.sys{text-align:center;font-size:12px;color:var(--fg2);margin:6px auto;max-width:80%}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px;position:relative}
.row.first{margin-top:10px}
.row.me{justify-content:flex-end}
.row .av{width:28px;flex:none}
.stack{display:flex;flex-direction:column;max-width:min(62%,560px);min-width:0}
.row.me .stack{align-items:flex-end}
.row.them .stack{align-items:flex-start}
.sender{font-size:11.5px;color:var(--fg2);margin:0 12px 2px}
.bubble{position:relative;padding:8px 13px;border-radius:19px;font-size:15.5px;line-height:1.32;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;cursor:default;transition:transform .12s;user-select:text;-webkit-user-select:text}
.row.me .bubble{background:var(--me);color:var(--me-fg)}
.row.them .bubble{background:var(--them);color:var(--them-fg)}
.row.me:not(.last) .bubble{border-bottom-right-radius:6px}
.row.me:not(.first) .bubble{border-top-right-radius:6px}
.row.them:not(.last) .bubble{border-bottom-left-radius:6px}
.row.them:not(.first) .bubble{border-top-left-radius:6px}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.bubble.big{background:none!important;padding:0 2px;font-size:44px;line-height:1.1}
.bubble.deleted{background:none!important;color:var(--fg2)!important;border:1px solid var(--line2);font-style:italic;font-size:14px}
.row.pending .bubble{opacity:.55}
.reply-ref{font-size:12.5px;color:var(--fg2);padding:6px 11px;margin:0 0 3px;border-radius:14px;border:1px solid var(--line2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.reply-ref b{font-weight:600;color:var(--fg)}
.reply-ref .icon{width:11px;height:11px;display:inline;vertical-align:-1px;margin-right:4px}
.meta{font-size:11px;color:var(--fg2);margin:2px 12px 0}
.receipt{font-size:11px;color:var(--fg2);text-align:right;margin:3px 4px 0;font-weight:500}
.reacts{position:absolute;top:-14px;display:flex;gap:2px;z-index:1}
.row.me .reacts{left:-14px}
.row.them .reacts{right:-14px}
.react{height:24px;min-width:24px;padding:0 6px;border-radius:12px;background:var(--bg2);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;box-shadow:0 0 0 2px var(--bg);cursor:pointer}
.react.mine{background:var(--fg);color:var(--bg)}
.react svg{width:13px;height:13px}
.row.has-react{margin-top:16px}
.acts{display:flex;gap:2px;opacity:0;align-self:center;flex:none;transition:opacity .12s}
.acts button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--fg2)}
.acts .icon{width:15px;height:15px}
.acts button:hover{background:var(--hover);color:var(--fg)}
.row:hover .acts{opacity:1}
.row.me .acts{order:-1}
.flash .bubble{transform:scale(1.04)}
.typing{display:flex;gap:4px;padding:12px 14px;border-radius:19px;background:var(--them);width:max-content;margin:10px 0 2px 36px}
.typing.flush{margin-left:0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--fg2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.typing-wrap .who{font-size:11.5px;color:var(--fg2);margin:8px 0 -6px 48px}

.composer{padding:8px 14px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:var(--bg)}
.ctx{display:flex;align-items:center;gap:10px;margin:0 6px 8px;padding:8px 6px 8px 12px;border-left:2px solid var(--fg);font-size:13px;color:var(--fg2)}
.ctx div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx b{color:var(--fg);font-weight:600}
.ctx .ibtn{width:26px;height:26px}
.ctx .icon{width:15px;height:15px}
.cbox{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:4px 4px 4px 14px;background:var(--bg);transition:border-color .15s}
.cbox:focus-within{border-color:var(--fg3)}
.cbox textarea{flex:1;resize:none;max-height:140px;padding:6px 0;font-size:15.5px;line-height:1.35}
.cbox textarea::placeholder{color:var(--fg3)}
.send{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none;transition:opacity .15s,transform .15s}
.send:disabled{opacity:0;transform:scale(.6);pointer-events:none}
.send .icon{width:16px;height:16px;stroke-width:2.4}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .18s ease}
.sheet{width:100%;max-width:420px;max-height:min(680px,calc(100dvh - 40px));background:var(--bg);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
[data-theme="dark"] .sheet{background:var(--bg2)}
.sheet-head{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{text-align:center;font-size:16px;font-weight:600}
.sheet-head .l{justify-self:start;font-size:15px;color:var(--fg2);padding:4px 6px}
.sheet-head .r{justify-self:end;font-size:15px;font-weight:600;padding:4px 6px}
.sheet-head .r:disabled{opacity:.3;cursor:default}
.sheet-body{overflow-y:auto;flex:1}
.to{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:50px}
.to label{color:var(--fg2);margin-right:2px}
.to input{flex:1;min-width:120px;height:28px}
.chip{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 11px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500}
.chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;opacity:.7}
.chip .icon{width:12px;height:12px;stroke-width:2.4}
.gname{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.gname label{color:var(--fg2)}
.gname input{flex:1;height:30px}
.section{font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;padding:14px 16px 6px}
.person{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
.person:hover,.person.cur{background:var(--hover)}
.person .t{flex:1;min-width:0}
.person .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .t .s{font-size:13px;color:var(--fg2)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.person.on .check{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.check .icon{width:13px;height:13px;stroke-width:2.6;opacity:0}
.person.on .check .icon{opacity:1}
.hint{padding:24px 16px;text-align:center;color:var(--fg2);font-size:14px}
.tag{font-size:12px;color:var(--fg2);flex:none}
.small-btn{font-size:13px;font-weight:500;color:var(--fg2);padding:4px 8px;border-radius:8px}
.small-btn:hover{background:var(--hover);color:var(--fg)}
.hero{display:flex;flex-direction:column;align-items:center;padding:26px 16px 18px;gap:10px;text-align:center}
.hero .title{font-size:20px;font-weight:600;letter-spacing:-.01em}
.hero .sub{color:var(--fg2);font-size:14px;margin-top:-6px}
.hero input.title{text-align:center;width:100%;border-radius:10px;padding:4px 8px}
.hero input.title:focus{background:var(--bg2)}
.group-list{margin:0 12px;border-radius:12px;background:var(--bg2);overflow:hidden}
[data-theme="dark"] .group-list{background:var(--bg3)}
.group-list>*+*{border-top:1px solid var(--line)}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;font-size:15px}
button.cell:hover{background:var(--hover)}
.cell .grow{flex:1;min-width:0}
.cell .icon{width:18px;height:18px;color:var(--fg2)}
.cell.strong{font-weight:600}
.seg{display:flex;background:var(--bg3);border-radius:9px;padding:2px;margin:0 12px}
[data-theme="dark"] .seg{background:var(--bg)}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;color:var(--fg2)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
[data-theme="dark"] .seg button.on{background:var(--bg3)}
.pad{height:18px}

.menu{position:fixed;z-index:60;min-width:220px;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-radius:14px;box-shadow:var(--shadow);padding:6px;animation:pop .16s cubic-bezier(.2,.9,.3,1.1)}
.tapbacks{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tapbacks button{flex:1;height:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700}
.tapbacks button:hover{background:var(--hover)}
.tapbacks button.on{background:var(--fg);color:var(--bg)}
.tapbacks svg{width:18px;height:18px}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;text-align:left}
.menu .mi:hover{background:var(--fg);color:var(--bg)}
.menu .mi .icon{width:16px;height:16px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu-scrim{position:fixed;inset:0;z-index:59}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 40px);text-align:center;animation:rise .25s ease}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--fg);animation:spin .8s linear infinite}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.avatar .pres{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:9px;min-height:9px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 2.5px var(--bg)}
.item.active .avatar .pres{box-shadow:0 0 0 2.5px var(--bg)}
.field.handle{display:flex;align-items:center;gap:2px;cursor:text}
.field.handle span{color:var(--fg2)}
.field.handle input{flex:1;height:100%;font-size:16px}
.field.handle:focus-within{border-color:var(--line2);background:var(--bg)}
kbd{font-family:var(--font);font-size:11px;font-weight:500;color:var(--fg2);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;margin-left:4px;line-height:1.4}
.search kbd{opacity:.8}
.search:focus-within kbd{display:none}
.keys .cell{padding:9px 14px;font-size:14px}
.foot{font-size:12px;color:var(--fg2);text-align:center;padding:10px 28px 20px;line-height:1.45}
.person .t .s:empty{display:none}
.cell .s:empty{display:none}
.main .placeholder{font-size:14px}
</style>
</head>

const MOD = MAC ? '⌘' : 'Ctrl+', ALT = MAC ? '⌥' : 'Alt+';

const ICONS = {
  compose: '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  info: '<circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5"/><path d="M12 8h.01"/>',
  up: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  reply: '<path d="m9 17-5-5 5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  edit: '<path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L7 20l-4 1 1-4Z"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  leave: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  addUser: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>'
};
const icon = n => `<svg class="icon" viewBox="0 0 24 24">${ICONS[n]}</svg>`;

const THUMB = '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>';
const TAPBACKS = [
  ['heart', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4 0 6.1 4.3 4.6 7.7C19.5 16.4 12 21 12 21Z"/></svg>'],
  ['up', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${THUMB}</svg>`],
  ['down', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="matrix(1 0 0 -1 0 24)">${THUMB}</g></svg>`],
  ['haha', 'HA'],
  ['bang', '!!'],
  ['q', '?']
];
const TB = Object.fromEntries(TAPBACKS);

const S = {
  user: null, profile: null, chats: new Map(), status: new Map(), activeId: null, messages: [], pending: new Set(),
  subs: [], chatSubs: new Map(), statusSubs: new Map(), msgOff: null,
  replyTo: null, editing: null, editDraft: '', filter: '', typingSentAt: 0, drafts: {}, readMarked: {}, receiptKey: '', forceBottom: false, users: new Map(), offset: 0
};
const uid = () => S.user?.uid;
const now = () => Date.now() + S.offset;
const myName = () => S.profile?.name || 'Me';
const members = c => keys(c.members);
const others = c => members(c).filter(m => m !== uid());
const chatTitle = c => c.type === 'group'
  ? (c.name || others(c).map(id => firstName(c.names?.[id])).filter(Boolean).join(', ') || 'Group')
  : (c.names?.[others(c)[0]] || 'Unknown');
const isUnread = c => { const lm = c.lastMessage; if (!lm || lm.senderId === uid()) return false; return ms(c.lastRead?.[uid()]) < ms(c.updatedAt); };
const online = id => !!S.status.get(id)?.online;

function avatarHTML(name, size = 40, dot = false) {
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px">${esc(initials(name))}${dot ? '<i class="pres"></i>' : ''}</div>`;
}
function chatAvatar(c, size = 40) {
  const o = others(c);
  if (c.type !== 'group') return avatarHTML(chatTitle(c), size, online(o[0]));
  if (o.length < 2) return avatarHTML(c.name || (o[0] && c.names?.[o[0]]) || 'G', size);
  const s = Math.round(size * .66), f = Math.round(s * .38);
  const a = esc(initials(c.names?.[o[0]])), b = esc(initials(c.names?.[o[1]]));
  return `<div class="avatar group" style="width:${size}px;height:${size}px"><span style="width:${s}px;height:${s}px;font-size:${f}px;left:0;top:0">${a}</span><span style="width:${s}px;height:${s}px;font-size:${f}px;right:0;bottom:0">${b}</span></div>`;
}

function applyTheme() {
  const pref = localStorage.getItem('a1-theme') || 'system';
  const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

let toastTimer;
function toast(msg) {
  $('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
function friendly(e) {
  const c = String(e?.code || '').toLowerCase(), m = String(e?.message || '');
  if (c.includes('permission') || /permission/i.test(m)) return 'Permission denied. Publish the A1 database rules.';
  if (c.includes('network') || /network|offline/i.test(m)) return 'You appear to be offline.';
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'Enable Anonymous sign-in in the Firebase console.';
  return m.replace(/^Firebase:\s*/, '').replace(/\s*\(.*\)\.?$/, '') || 'Something went wrong.';
}

const dayOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
function timeShort(t) {
  if (!t) return '';
  const d = new Date(t), diff = Math.round((dayOf(new Date()) - dayOf(d)) / 864e5);
  if (diff === 0) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { month: 'numeric', day: 'numeric', year: '2-digit' });
}
function timeSep(t) {
  const d = new Date(t), n = new Date(), diff = Math.round((dayOf(n) - dayOf(d)) / 864e5);
  const tm = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (diff === 0) return `<b>Today</b> ${tm}`;
  if (diff === 1) return `<b>Yesterday</b> ${tm}`;
  if (diff < 7) return `<b>${d.toLocaleDateString([], { weekday: 'long' })}</b> ${tm}`;
  return `<b>${d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric' })}</b> at ${tm}`;
}
function ago(t) {
  const s = Math.max(0, (now() - t) / 1000);
  if (s < 60) return 'Active just now';
  if (s < 3600) return `Active ${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `Active ${Math.floor(s / 3600)}h ago`;
  if (s < 7 * 86400) return `Active ${Math.floor(s / 86400)}d ago`;
  return '';
}
function linkify(s) {
  return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}
const isEmojiOnly = s => { const t = String(s || '').trim(); if (!t || t.length > 24) return false; try { return /^(?:\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u.test(t) && !/^[\d#*\s]+$/.test(t) && [...t].filter(ch => /\p{Extended_Pictographic}/u.test(ch)).length <= 3; } catch (e) { return false; } };

const app = $('#app');
function renderNotice(title, body, retry) {
  app.innerHTML = `<div class="center"><div class="notice"><div class="mark">A1</div><h2>${title}</h2><p>${body}</p>${retry ? '<button class="primary pill" data-retry>Try Again</button>' : ''}</div></div>`;
  $('[data-retry]', app)?.addEventListener('click', retry);
}

let auth, rdb, SV;
if (!window.firebase || !firebase.database) {
  renderNotice('Can’t reach Firebase', 'A1 needs an internet connection to load. Check your connection and reload.', () => location.reload());
} else {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  rdb = firebase.database();
  SV = firebase.database.ServerValue.TIMESTAMP;
  rdb.ref('.info/serverTimeOffset').on('value', s => { S.offset = s.val() || 0; });
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(() => { }));
  app.innerHTML = '<div class="center"><div class="spinner"></div></div>';
  auth.onAuthStateChanged(u => { if (u) start(u); else { stop(); signIn(); } });
}

function signIn() {
  app.innerHTML = '<div class="center"><div class="spinner"></div></div>';
  auth.signInAnonymously().catch(e => renderNotice('Couldn’t sign in', esc(friendly(e)), signIn));
}

function stop() {
  [...S.subs, ...S.chatSubs.values(), ...S.statusSubs.values()].forEach(f => { try { f(); } catch (e) { } });
  if (S.msgOff) try { S.msgOff(); } catch (e) { }
  Object.assign(S, { user: null, profile: null, activeId: null, messages: [], subs: [], msgOff: null, replyTo: null, editing: null, drafts: {}, readMarked: {} });
  S.chats.clear(); S.status.clear(); S.chatSubs.clear(); S.statusSubs.clear(); S.users.clear(); S.pending.clear();
  closeSheet(); closeMenu();
  document.title = 'A1';
}

async function start(u) {
  if (S.user?.uid === u.uid) return;
  stop();
  S.user = u;
  let snap;
  try { snap = await rdb.ref('users/' + u.uid).once('value'); }
  catch (e) { renderNotice('Couldn’t load your profile', esc(friendly(e)), () => { S.user = null; start(u); }); return; }
  if (S.user?.uid !== u.uid) return;
  if (!snap.exists()) renderWelcome(); else enter(snap.val());
}

function renderWelcome() {
  app.innerHTML = `
  <div class="center"><form class="auth" novalidate>
    <div class="mark">A1</div>
    <h2>Choose how people will find you.</h2>
    <input class="field" name="name" placeholder="Name" autocomplete="name" maxlength="40">
    <label class="field handle"><span>@</span><input name="handle" placeholder="username" autocomplete="off" spellcheck="false" maxlength="20"></label>
    <div class="err"></div>
    <button class="primary" type="submit">Continue</button>
    <div class="alt">Your account lives in this browser. No email or password needed.</div>
  </form></div>`;
  const f = $('form', app), err = $('.err', f), btn = $('.primary', f);
  f.handle.oninput = () => { const v = f.handle.value.toLowerCase().replace(/[^a-z0-9_]/g, ''); if (v !== f.handle.value) f.handle.value = v; };
  f.name.oninput = () => { if (!f.handle.dataset.touched) f.handle.value = f.name.value.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 20); };
  f.handle.addEventListener('keydown', () => f.handle.dataset.touched = '1');
  f.onsubmit = async e => {
    e.preventDefault(); err.textContent = '';
    const name = f.name.value.trim(), handle = f.handle.value.trim();
    if (!name) { err.textContent = 'Enter your name.'; f.name.focus(); return; }
    if (!/^[a-z0-9_]{3,20}$/.test(handle)) { err.textContent = 'Usernames are 3–20 letters, numbers or underscores.'; f.handle.focus(); return; }
    btn.disabled = true;
    const me = uid();
    let owner;
    try { owner = (await rdb.ref('handles/' + handle).once('value')).val(); }
    catch (ex) { err.textContent = friendly(ex); btn.disabled = false; return; }
    try {
      if (owner && owner !== me) { err.textContent = `@${handle} is taken.`; btn.disabled = false; f.handle.focus(); return; }
      await rdb.ref('handles/' + handle).set(me);
      const profile = { name, nameLower: name.toLowerCase(), handle, createdAt: SV };
      await rdb.ref('users/' + me).set(profile);
      enter({ ...profile, createdAt: now() });
    } catch (ex) { err.textContent = /permission/i.test(String(ex?.message || ex?.code)) ? `@${handle} is taken.` : friendly(ex); btn.disabled = false; }
  };
  setTimeout(() => f.name.focus(), 30);
}

function on(ref, ev, cb, errCb) {
  const fn = ref.on(ev, cb, errCb || (e => toast(friendly(e))));
  return () => ref.off(ev, fn);
}

function enter(profile) {
  const me = uid();
  S.profile = profile;
  S.subs.push(on(rdb.ref('users/' + me), 'value', s => { if (s.exists()) { S.profile = s.val(); const b = $('.me-btn'); if (b) b.innerHTML = avatarHTML(myName(), 30); } }));
  const statusRef = rdb.ref('status/' + me);
  S.subs.push(on(rdb.ref('.info/connected'), 'value', s => {
    if (!s.val()) return;
    statusRef.onDisconnect().set({ online: false, lastSeen: SV }).then(() => statusRef.set({ online: true, lastSeen: SV })).catch(() => { });
  }));
  renderShell();
  const ucRef = rdb.ref('userChats/' + me);
  S.subs.push(on(ucRef, 'child_added', s => watchChat(s.key)));
  S.subs.push(on(ucRef, 'child_removed', s => unwatchChat(s.key, true)));
}

let chatsFrame = 0;
function chatsChanged() {
  if (chatsFrame) return;
  chatsFrame = requestAnimationFrame(() => {
    chatsFrame = 0;
    renderList();
    if (S.activeId && S.chats.has(S.activeId)) { renderHeader(); renderTyping(); if (receiptKey() !== S.receiptKey) renderMessages(); maybeMarkRead(); }
    updateTitle();
  });
}

function watchChat(id) {
  if (S.chatSubs.has(id)) return;
  S.chatSubs.set(id, on(rdb.ref('chats/' + id), 'value', s => {
    if (!s.exists()) { S.chats.delete(id); chatsChanged(); return; }
    const c = { id, ...s.val() };
    S.chats.set(id, c);
    if (c.type === 'direct') others(c).forEach(watchStatus);
    chatsChanged();
  }, () => unwatchChat(id, true)));
}
function unwatchChat(id, removed) {
  const off = S.chatSubs.get(id); if (off) { try { off(); } catch (e) { } }
  S.chatSubs.delete(id); S.chats.delete(id);
  if (removed && S.activeId === id) { closeChat(); toast('You’re no longer in that conversation.'); }
  chatsChanged();
}
function watchStatus(id) {
  if (!id || S.statusSubs.has(id)) return;
  S.statusSubs.set(id, on(rdb.ref('status/' + id), 'value', s => { S.status.set(id, s.val() || {}); chatsChanged(); }, () => { }));
}

function renderShell() {
  app.innerHTML = `
  <aside class="side">
    <div class="side-head">
      <h1>Messages</h1>
      <button class="me-btn" title="Settings">${avatarHTML(myName(), 30)}</button>
      <button class="ibtn" data-compose title="New Message (${ALT}N)">${icon('compose')}</button>
    </div>
    <label class="search">${icon('search')}<input placeholder="Search" spellcheck="false"><kbd>${MOD}K</kbd></label>
    <div class="list"></div>
  </aside>
  <main class="main"><div class="placeholder">Select a conversation or start a new one.</div></main>`;
  $('.me-btn').onclick = openSettings;
  $('[data-compose]').onclick = () => openCompose();
  const si = $('.search input');
  si.oninput = () => { S.filter = si.value.trim().toLowerCase(); renderList(); };
  si.onkeydown = e => {
    if (e.key === 'Escape') { si.value = ''; S.filter = ''; renderList(); si.blur(); }
    if (e.key === 'Enter') { const first = $('.list .item'); if (first) { openChat(first.dataset.id); si.blur(); } }
  };
  renderList();
}

function previewText(c) {
  const lm = c.lastMessage;
  if (!lm) return c.type === 'group' ? 'New group' : 'No messages yet';
  if (lm.system) return lm.text;
  const who = lm.senderId === uid() ? 'You: ' : c.type === 'group' ? firstName(lm.senderName) + ': ' : '';
  return who + (lm.text || '');
}

function sortedChats() { return [...S.chats.values()].sort((a, b) => ms(b.updatedAt) - ms(a.updatedAt)); }

function renderList() {
  const list = $('.list'); if (!list) return;
  let chats = sortedChats();
  if (S.filter) chats = chats.filter(c => chatTitle(c).toLowerCase().includes(S.filter) || (c.lastMessage?.text || '').toLowerCase().includes(S.filter) || Object.values(c.names || {}).some(n => String(n).toLowerCase().includes(S.filter)));
  if (!chats.length) {
    list.innerHTML = S.filter
      ? `<div class="empty">No results for “${esc(S.filter)}”</div>`
      : `<div class="empty"><b>No Conversations</b>Message someone by their username, or start a group.<br><button class="primary pill" data-new>New Message</button></div>`;
    $('[data-new]', list)?.addEventListener('click', () => openCompose());
    return;
  }
  list.innerHTML = chats.map(c => `
    <div class="item${c.id === S.activeId ? ' active' : ''}${isUnread(c) ? ' unread' : ''}" data-id="${esc(c.id)}">
      <div class="dot"></div>
      ${chatAvatar(c, 44)}
      <div class="body">
        <div class="top"><div class="name">${esc(chatTitle(c))}</div><div class="time">${esc(timeShort(ms(c.updatedAt)))}</div></div>
        <div class="preview">${esc(previewText(c))}</div>
      </div>
    </div>`).join('');
  $$('.item', list).forEach(el => el.onclick = () => openChat(el.dataset.id));
}

function updateTitle() {
  const n = [...S.chats.values()].filter(isUnread).length;
  document.title = n ? `A1 (${n})` : 'A1';
}

function closeChat() {
  saveDraft();
  if (S.msgOff) try { S.msgOff(); } catch (e) { }
  S.msgOff = null; S.activeId = null; S.messages = []; S.replyTo = null; S.editing = null;
  const main = $('.main'); if (main) main.innerHTML = '<div class="placeholder">Select a conversation or start a new one.</div>';
  renderList();
}
function saveDraft() { const ta = $('.cbox textarea'); if (S.activeId && ta && !S.editing) S.drafts[S.activeId] = ta.value; }

function openChat(id) {
  if (S.activeId === id) { $('.cbox textarea')?.focus(); return; }
  saveDraft();
  if (S.msgOff) try { S.msgOff(); } catch (e) { }
  S.activeId = id; S.messages = []; S.replyTo = null; S.editing = null; S.receiptKey = ''; S.forceBottom = true;
  renderConversation();
  renderList();
  S.msgOff = on(rdb.ref('messages/' + id).orderByChild('createdAt').limitToLast(500), 'value', s => {
    if (S.activeId !== id) return;
    const out = []; s.forEach(c => { out.push({ id: c.key, ...c.val() }); });
    S.messages = out;
    renderMessages(); maybeMarkRead();
  }, e => { if (S.activeId === id) toast(friendly(e)); });
}

function renderConversation() {
  const main = $('.main');
  main.innerHTML = `
    <header class="chead">
      <span></span>
      <div class="who" title="Details"></div>
      <button class="ibtn info" title="Details (${MOD}I)">${icon('info')}</button>
    </header>
    <div class="msgs"><div class="spacer"></div><div class="mlist"></div><div class="typing-wrap"></div></div>
    <div class="composer">
      <div class="ctx hidden"></div>
      <div class="cbox"><textarea rows="1" placeholder="Message"></textarea><button class="send" disabled title="Send (Return)">${icon('up')}</button></div>
    </div>`;
  $('.info', main).onclick = openInfo;
  $('.who', main).onclick = openInfo;
  const ta = $('textarea', main), sendBtn = $('.send', main);
  ta.value = S.drafts[S.activeId] || '';
  const sync = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; sendBtn.disabled = !ta.value.trim(); };
  sync();
  ta.oninput = () => { sync(); pingTyping(); };
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    else if (e.key === 'Escape' && (S.replyTo || S.editing)) { e.preventDefault(); e.stopPropagation(); clearCtx(); }
    else if (e.key === 'ArrowUp' && !ta.value) { const m = [...S.messages].reverse().find(x => x.senderId === uid() && x.type !== 'system' && !x.deleted); if (m) { e.preventDefault(); startEdit(m); } }
  };
  sendBtn.onclick = send;
  const list = $('.msgs', main);
  list.addEventListener('contextmenu', e => { const row = e.target.closest('.row'); if (!row || e.target.closest('a')) return; e.preventDefault(); openMsgMenu(row.dataset.id, e.clientX, e.clientY); });
  list.addEventListener('dblclick', e => { const b = e.target.closest('.bubble'); if (!b) return; const r = b.getBoundingClientRect(); window.getSelection()?.removeAllRanges(); openMsgMenu(b.closest('.row').dataset.id, r.left + r.width / 2, r.top); });
  list.addEventListener('click', e => {
    const more = e.target.closest('.more'); if (more) { const r = more.getBoundingClientRect(); openMsgMenu(more.closest('.row').dataset.id, r.left, r.bottom + 4); return; }
    const rb = e.target.closest('.quick-reply'); if (rb) { const m = S.messages.find(x => x.id === rb.closest('.row').dataset.id); if (m) startReply(m); return; }
    const re = e.target.closest('.react'); if (re) { toggleReact(re.closest('.row').dataset.id, re.dataset.k); return; }
    const rr = e.target.closest('.reply-ref'); if (rr) jumpTo(rr.dataset.to);
  });
  renderHeader(); renderMessages(); renderTyping(); renderCtx();
  ta.focus();
}

function renderHeader() {
  const c = S.chats.get(S.activeId), who = $('.chead .who'); if (!c || !who) return;
  let sub = '';
  if (c.type === 'group') sub = `${members(c).length} members`;
  else { const st = S.status.get(others(c)[0]); sub = st?.online ? 'Active now' : st?.lastSeen ? ago(st.lastSeen) : ''; }
  who.innerHTML = `${chatAvatar(c, 38)}<div class="n"><span>${esc(chatTitle(c))}</span>${icon('chevron')}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}`;
}

function receiptKey() {

function renderMessages() {
  const box = $('.msgs'), list = $('.mlist'); if (!box || !list) return;
  const c = S.chats.get(S.activeId); if (!c) return;
  S.receiptKey = receiptKey();
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  const me = uid(), group = c.type === 'group', msgs = S.messages;
  const gap = 15 * 60e3;
  let html = '', prev = null;
  const lastMine = [...msgs].reverse().find(m => m.senderId === me && m.type !== 'system');
  if (!msgs.length) html = `<div class="sys" style="margin-top:auto">${group ? 'This is the beginning of the group.' : 'Say hello to ' + esc(firstName(chatTitle(c))) + '.'}</div>`;
  msgs.forEach((m, i) => {
    const t = ms(m.createdAt), next = msgs[i + 1];
    if (!prev || t - ms(prev.createdAt) > gap) html += `<div class="sep">${timeSep(t || now())}</div>`;
    if (m.type === 'system') { html += `<div class="sys">${esc(m.text)}</div>`; prev = m; return; }
    const brk = x => !x || x.type === 'system' || x.senderId !== m.senderId;
    const first = brk(prev) || t - ms(prev.createdAt) > gap;
    const last = brk(next) || ms(next.createdAt) - t > gap;
    const mine = m.senderId === me;
    const reacts = Object.entries(m.reactions || {}).map(([k, v]) => [k, keys(v)]).filter(([k, v]) => TB[k] && v.length);
    const big = !m.deleted && isEmojiOnly(m.text);
    html += `<div class="row ${mine ? 'me' : 'them'}${first ? ' first' : ''}${last ? ' last' : ''}${S.pending.has(m.id) ? ' pending' : ''}${reacts.length ? ' has-react' : ''}" data-id="${esc(m.id)}">`;
    if (!mine && group) html += `<div class="av">${last ? avatarHTML(c.names?.[m.senderId] || m.senderName, 28) : ''}</div>`;
    html += `<div class="stack">`;
    if (!mine && group && first) html += `<div class="sender">${esc(c.names?.[m.senderId] || m.senderName || '')}</div>`;
    if (m.replyTo && !m.deleted) html += `<div class="reply-ref" data-to="${esc(m.replyTo.id)}">${icon('reply')}<b>${esc(m.replyTo.senderId === me ? 'You' : firstName(c.names?.[m.replyTo.senderId] || m.replyTo.senderName))}</b> ${esc(clip(m.replyTo.text, 60))}</div>`;
    html += `<div class="bubble${big ? ' big' : ''}${m.deleted ? ' deleted' : ''}" title="${esc(new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }))}">${m.deleted ? 'Message deleted' : linkify(m.text)}`;
    if (reacts.length) html += `<div class="reacts">${reacts.map(([k, v]) => `<button class="react${v.includes(me) ? ' mine' : ''}" data-k="${k}" title="${esc(v.map(id => id === me ? 'You' : firstName(c.names?.[id]) || 'Someone').join(', '))}">${TB[k]}${v.length > 1 ? `<span>${v.length}</span>` : ''}</button>`).join('')}</div>`;
    html += `</div>`;
    if (m.editedAt && !m.deleted) html += `<div class="meta">Edited</div>`;
    if (lastMine && m.id === lastMine.id) html += `<div class="receipt">${esc(receiptFor(c, m))}</div>`;
    html += `</div>`;
    if (!m.deleted) html += `<div class="acts"><button class="quick-reply" title="Reply">${icon('reply')}</button><button class="more" title="More">${icon('dots')}</button></div>`;
    html += `</div>`;
    prev = m;
  });
  list.innerHTML = html;
  if (atBottom || S.forceBottom) { box.scrollTop = box.scrollHeight; S.forceBottom = false; }
}

function receiptFor(c, m) {
  if (S.pending.has(m.id)) return 'Sending…';
  const t = ms(m.createdAt), o = others(c);
  const read = o.filter(id => ms(c.lastRead?.[id]) >= t);
  if (c.type !== 'group') return read.length ? 'Read' : 'Delivered';
  if (!read.length) return 'Delivered';
  if (read.length === o.length) return o.length === 1 ? 'Read' : 'Read by Everyone';
  return `Read by ${read.length}`;
}

function send() {
  const ta = $('.cbox textarea'), c = S.chats.get(S.activeId); if (!ta || !c) return;
  const text = ta.value.trim(); if (!text) return;
  const me = uid(), base = 'chats/' + c.id;
  if (S.editing) {
    const m = S.editing;
    S.editing = null; ta.value = S.editDraft || ''; S.editDraft = ''; renderCtx(); ta.dispatchEvent(new Event('input'));
    if (text === m.text) return;
    const upd = { [`messages/${c.id}/${m.id}/text`]: text, [`messages/${c.id}/${m.id}/editedAt`]: SV };
    if (S.messages[S.messages.length - 1]?.id === m.id) upd[base + '/lastMessage/text'] = clip(text, 200);
    rdb.ref().update(upd).catch(e => toast(friendly(e)));
    return;

  ta.value = ''; S.drafts[c.id] = ''; S.replyTo = null; S.typingSentAt = 0; renderCtx(); ta.dispatchEvent(new Event('input'));

    .catch(e => { S.pending.delete(key); toast(friendly(e)); });
}

async function searchUsers(q) {
  q = q.trim().toLowerCase().replace(/^@/, ''); if (!q) return [];
  const users = rdb.ref('users'), out = new Map();
  const res = await Promise.allSettled([
    users.orderByChild('handle').startAt(q).endAt(q + '').limitToFirst(10).once('value'),
    users.orderByChild('nameLower').startAt(q).endAt(q + '').limitToFirst(10).once('value')
  ]);
  res.forEach(r => r.status === 'fulfilled' && r.value.forEach(d => { if (d.key !== uid()) out.set(d.key, { id: d.key, ...d.val() }); }));
  if (res.every(r => r.status === 'rejected')) throw res[0].reason;
  return [...out.values()].sort((a, b) => (b.handle === q) - (a.handle === q));
}
function knownPeople(exclude = []) {
  const seen = new Map();
  sortedChats().forEach(c => others(c).forEach(id => { if (!seen.has(id) && !exclude.includes(id)) seen.set(id, { id, name: c.names?.[id] || 'Unknown' }); }));
  return [...seen.values()].slice(0, 30);
}
function getUser(id) {
  if (S.users.has(id)) return S.users.get(id);
  const p = rdb.ref('users/' + id).once('value').then(d => d.exists() ? { id, ...d.val() } : { id, name: 'Unknown' }).catch(() => ({ id, name: 'Unknown' }));
  S.users.set(id, p); return p;
}

function peoplePicker(sheet, { exclude = [], onChange, initial = [] }) {
  const sel = new Map();
  const to = $('.to', sheet), input = $('.to input', sheet), results = $('.results', sheet);
  let timer, token = 0, shown = [], cursor = 0;
  const personRow = (p, i) => `<div class="person${sel.has(p.id) ? ' on' : ''}${i === cursor ? ' cur' : ''}" data-id="${esc(p.id)}">${avatarHTML(p.name, 36, online(p.id))}<div class="t"><div>${esc(p.name)}</div><div class="s" data-h="${esc(p.id)}">${p.handle ? '@' + esc(p.handle) : ''}</div></div><div class="check">${icon('check')}</div></div>`;
  const pick = p => {
    if (sel.has(p.id)) sel.delete(p.id); else sel.set(p.id, p);
    drawChips(); onChange([...sel.values()]);
    if (input.value) { input.value = ''; run(); } else draw(shown, results.dataset.label);
    input.focus();
  };
  const draw = (people, label) => {
    shown = people; results.dataset.label = label; cursor = Math.min(cursor, Math.max(0, people.length - 1));
    results.innerHTML = people.length ? `<div class="section">${esc(label)}</div>` + people.map(personRow).join('') : `<div class="hint">${input.value.trim() ? 'No one found with that name or username.' : 'Search by name or @username.'}</div>`;
    $$('.person', results).forEach(el => el.onclick = () => pick(shown.find(x => x.id === el.dataset.id)));
    people.filter(p => !p.handle).forEach(async p => { const u = await getUser(p.id); const el = $(`[data-h="${CSS.escape(p.id)}"]`, results); if (el && u.handle) el.textContent = '@' + u.handle; p.handle = u.handle; });
  };
  const drawChips = () => {
    $$('.chip', to).forEach(c => c.remove());
    [...sel.values()].forEach(p => {
      const chip = document.createElement('span'); chip.className = 'chip';
      chip.innerHTML = `${esc(firstName(p.name) || p.name)}<button title="Remove">${icon('x')}</button>`;
      $('button', chip).onclick = () => { sel.delete(p.id); drawChips(); draw(shown, results.dataset.label); onChange([...sel.values()]); input.focus(); };
      to.insertBefore(chip, input);
    });
  };
  const run = () => {
    const q = input.value.trim(), my = ++token; cursor = 0;
    clearTimeout(timer);
    if (!q) { draw(knownPeople(exclude), 'Suggested'); return; }
    timer = setTimeout(async () => {
      try { const r = (await searchUsers(q)).filter(p => !exclude.includes(p.id)); if (my === token) draw(r, 'People'); }
      catch (e) { if (my === token) results.innerHTML = `<div class="hint">${esc(friendly(e))}</div>`; }
    }, 180);
  };
  initial.forEach(p => sel.set(p.id, p));
  if (initial.length) { drawChips(); onChange([...sel.values()]); }
  input.oninput = run;
  input.onkeydown = e => {
    if (e.key === 'Backspace' && !input.value && sel.size) { sel.delete([...sel.keys()].pop()); drawChips(); draw(shown, results.dataset.label); onChange([...sel.values()]); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!shown.length) return; cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length; $$('.person', results).forEach((el, i) => el.classList.toggle('cur', i === cursor)); $$('.person', results)[cursor]?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { e.preventDefault(); if (input.value.trim() && shown[cursor]) pick(shown[cursor]); else if (!input.value.trim() && sel.size) $('.sheet .r')?.click(); }
  };
  run();
  input.focus();
  return sel;
}

  openChat(id);
}

      <div class="group-list">
        <button class="cell strong" data-add>${icon('addUser')}<span class="grow">Add People</span></button>
        ${mem.map(id => `<div class="cell">${avatarHTML(c.names?.[id], 32, id !== me && online(id))}<div class="grow"><div>${esc(id === me ? myName() + ' (You)' : c.names?.[id] || 'Unknown')}</div><div class="s" data-h="${esc(id)}"></div></div>${c.admins?.[id] ? '<span class="tag">Admin</span>' : ''}${id !== me ? `<button class="small-btn" data-msg="${esc(id)}">Message</button>` : ''}${admin && id !== me ? `<button class="small-btn" data-remove="${esc(id)}">Remove</button>` : ''}</div>`).join('')}
      </div>
      <div class="pad"></div>
      <div class="group-list"><button class="cell" data-leave>${icon('leave')}<span class="grow">Leave Group</span></button></div>
      <div class="pad"></div>`
  });
  mem.forEach(async id => { const u = await getUser(id); const el = $(`[data-h="${CSS.escape(id)}"]`, s); if (el && u.handle) el.textContent = '@' + u.handle; });
  const ti = $('input.title', s);
  ti.onkeydown = e => { if (e.key === 'Enter') ti.blur(); };
  ti.onblur = () => {
    const v = ti.value.trim(), cur = S.chats.get(c.id); if (!cur || v === (cur.name || '')) return;
    rdb.ref().update({ ...systemUpdate(c.id, v ? `${myName()} named the group “${v}”` : `${myName()} removed the group name`), [`chats/${c.id}/name`]: v }).catch(e => toast(friendly(e)));
  };
  $('[data-add]', s).onclick = () => openAddPeople(c.id);
  $$('[data-msg]', s).forEach(b => b.onclick = async () => { const id = b.dataset.msg; closeSheet(); try { await openDirect({ id, name: c.names?.[id] || 'Unknown' }); } catch (e) { toast(friendly(e)); } });
  $$('[data-remove]', s).forEach(b => b.onclick = () => {
    const id = b.dataset.remove, n = c.names?.[id] || 'this person';
    confirmSheet(`Remove ${firstName(n)}?`, `${n} will no longer receive messages from this group.`, 'Remove', () => rdb.ref().update({
      ...systemUpdate(c.id, `${myName()} removed ${n}`),
      [`chats/${c.id}/members/${id}`]: null, [`chats/${c.id}/admins/${id}`]: null, [`chats/${c.id}/typing/${id}`]: null, [`userChats/${id}/${c.id}`]: null
    }));
  });
  $('[data-leave]', s).onclick = () => confirmSheet('Leave Group?', 'You won’t receive messages from this group unless someone adds you back.', 'Leave', () => leaveGroup(c.id));
}

async function leaveGroup(id) {
  const c = S.chats.get(id); if (!c) return;
  const me = uid(), rest = others(c);
  const upd = {
    ...systemUpdate(id, `${myName()} left the group`),
    [`chats/${id}/members/${me}`]: null, [`chats/${id}/admins/${me}`]: null, [`chats/${id}/typing/${me}`]: null, [`chats/${id}/lastRead/${me}`]: null,
    [`userChats/${me}/${id}`]: null
  };
  if (!keys(c.admins).some(a => a !== me) && rest.length) upd[`chats/${id}/admins/${rest[0]}`] = true;
  closeChat();
  await rdb.ref().update(upd);
}

function openAddPeople(chatId) {
  const c = S.chats.get(chatId); if (!c) return;
  const s = openSheet({
    title: 'Add People', right: 'Add',
    body: `<div class="to"><label>Add:</label><input spellcheck="false" autocomplete="off" placeholder="Name or @username"></div><div class="results"></div>`,
    onRight: async () => {
      const people = [...sel.values()]; if (!people.length) return;
      r.disabled = true;
      const upd = systemUpdate(chatId, `${myName()} added ${people.map(p => p.name).join(', ')}`);
      people.forEach(p => { upd[`chats/${chatId}/members/${p.id}`] = true; upd[`chats/${chatId}/names/${p.id}`] = p.name; upd[`userChats/${p.id}/${chatId}`] = true; });
      try { await rdb.ref().update(upd); closeSheet(); } catch (e) { toast(friendly(e)); r.disabled = false; }
    }
  });
  const r = $('.r', s); r.disabled = true;
  const sel = peoplePicker(s, { exclude: members(c), onChange: l => r.disabled = !l.length });
}

function openDirectInfo(c) {
  const id = others(c)[0], name = c.names?.[id] || 'Unknown', st = S.status.get(id);
  const s = openSheet({
    title: 'Details', left: 'Done',
    body: `<div class="hero">${avatarHTML(name, 76, online(id))}<div class="title">${esc(name)}</div><div class="sub" data-h></div><div class="sub">${esc(st?.online ? 'Active now' : st?.lastSeen ? ago(st.lastSeen) : '')}</div></div>
      <div class="group-list"><button class="cell" data-group>${icon('users')}<span class="grow">Start a Group with ${esc(firstName(name))}</span></button></div><div class="pad"></div>`
  });
  getUser(id).then(u => { const el = $('[data-h]', s); if (el && u.handle) el.textContent = '@' + u.handle; });
  $('[data-group]', s).onclick = () => openCompose({ id, name });
}

function openSettings() {
  const pref = localStorage.getItem('a1-theme') || 'system';
  const s = openSheet({
    title: 'Settings', left: 'Done',
    body: `<div class="hero"><div data-av>${avatarHTML(myName(), 76)}</div><input class="title" value="${esc(myName())}" maxlength="40" title="Edit name"><div class="sub">@${esc(S.profile?.handle || '')}</div></div>
      <div class="section">Appearance</div>
      <div class="seg">${['system', 'light', 'dark'].map(v => `<button data-t="${v}" class="${v === pref ? 'on' : ''}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>
      <div class="section">Shortcuts</div>
      <div class="group-list keys">
        <div class="cell"><span class="grow">New message</span><kbd>${ALT}N</kbd></div>
        <div class="cell"><span class="grow">Search conversations</span><kbd>${MOD}K</kbd></div>
        <div class="cell"><span class="grow">Previous / next conversation</span><kbd>${ALT}↑</kbd><kbd>${ALT}↓</kbd></div>
        <div class="cell"><span class="grow">Edit last message</span><kbd>↑</kbd></div>
        <div class="cell"><span class="grow">Conversation details</span><kbd>${MOD}I</kbd></div>
      </div>
      <div class="pad"></div>
      <div class="group-list"><button class="cell" data-out>${icon('leave')}<span class="grow">Sign Out</span></button></div>
      <div class="foot">A1 uses an anonymous account stored in this browser. Signing out or clearing site data ends access to this account.</div>`
  });
  const ni = $('input.title', s);
  ni.onkeydown = e => { if (e.key === 'Enter') ni.blur(); };
  ni.onblur = async () => {
    const v = ni.value.trim();
    if (!v) { ni.value = myName(); return; }
    if (v === myName()) return;
    const me = uid(), upd = { [`users/${me}/name`]: v, [`users/${me}/nameLower`]: v.toLowerCase() };
    S.chats.forEach(c => upd[`chats/${c.id}/names/${me}`] = v);
    try { await rdb.ref().update(upd); const av = $('[data-av]', s); if (av) av.innerHTML = avatarHTML(v, 76); toast('Name updated'); } catch (e) { toast(friendly(e)); }
  };
  $$('.seg button', s).forEach(b => b.onclick = () => {
    localStorage.setItem('a1-theme', b.dataset.t); applyTheme();
    $$('.seg button', s).forEach(x => x.classList.toggle('on', x === b));
  });
  $('[data-out]', s).onclick = () => confirmSheet('Sign Out?', 'A1 accounts are anonymous, so you won’t be able to sign back in to this account. Your conversations will stay with the people you talked to.', 'Sign Out', async () => {
    const ref = rdb.ref('status/' + uid());
    try { await ref.onDisconnect().cancel(); await ref.set({ online: false, lastSeen: SV }); } catch (e) { }
    await auth.signOut();
  });
}

function moveChat(dir) {
  const list = $$('.list .item'); if (!list.length) return;
  const i = list.findIndex(el => el.dataset.id === S.activeId);
  const n = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + dir));
  openChat(list[n].dataset.id);
  list[n].scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.menu')) { closeMenu(); return; } if ($('.scrim')) { closeSheet(); return; } }
  if (!S.profile || !$('.side')) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.code === 'KeyK') { e.preventDefault(); closeSheet(); $('.search input')?.focus(); }
  else if (e.altKey && !mod && e.code === 'KeyN') { e.preventDefault(); openCompose(); }
  else if (mod && e.code === 'KeyI' && S.activeId) { e.preventDefault(); openInfo(); }
  else if (e.altKey && !$('.scrim') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); moveChat(e.key === 'ArrowUp' ? -1 : 1); }
});
</script>
</body>
</html>
