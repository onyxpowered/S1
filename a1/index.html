<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>A1</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f5f5f7;--bg3:#e8e8ed;--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#a1a1a6;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--hover:rgba(0,0,0,.04);--sel:rgba(0,0,0,.065);
  --me:#1d1d1f;--me-fg:#ffffff;--them:#ebebed;--them-fg:#1d1d1f;
  --glass:rgba(255,255,255,.8);--scrim:rgba(0,0,0,.28);
  --avatar:#c7c7cc;--avatar-fg:#ffffff;--btn:#1d1d1f;--btn-fg:#ffffff;
  --shadow:0 12px 48px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.1);
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#000000;--bg2:#1c1c1e;--bg3:#2c2c2e;--fg:#f5f5f7;--fg2:#98989d;--fg3:#636366;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);
  --me:#f5f5f7;--me-fg:#000000;--them:#262628;--them-fg:#f5f5f7;
  --glass:rgba(22,22,24,.78);--scrim:rgba(0,0,0,.5);
  --avatar:#48484a;--avatar-fg:#f5f5f7;--btn:#f5f5f7;--btn-fg:#000000;
  --shadow:0 12px 48px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
::selection{background:var(--fg);color:var(--bg)}
svg{display:block}
.hidden{display:none!important}

.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:background .15s}
.ibtn:hover{background:var(--hover)}
.ibtn:active{background:var(--sel)}

.avatar{flex:none;border-radius:50%;background:var(--avatar);color:var(--avatar-fg);display:grid;place-items:center;font-weight:600;letter-spacing:.02em;user-select:none;position:relative}
.avatar.group{background:none}
.avatar.group span{position:absolute;border-radius:50%;background:var(--avatar);color:var(--avatar-fg);display:grid;place-items:center;font-weight:600;box-shadow:0 0 0 2px var(--bg)}

#app{height:100%;display:flex}

.center{flex:1;display:grid;place-items:center;padding:24px;overflow:auto}
.auth{width:100%;max-width:340px;text-align:center}
.mark{font-size:44px;font-weight:700;letter-spacing:-.04em;margin-bottom:6px}
.auth h2{font-size:17px;font-weight:500;color:var(--fg2);margin-bottom:32px}
.field{display:block;width:100%;height:46px;padding:0 16px;border-radius:12px;background:var(--bg2);font-size:16px;margin-bottom:10px;border:1px solid transparent;transition:border-color .15s,background .15s}
.field:focus{border-color:var(--line2);background:var(--bg)}
.primary{width:100%;height:46px;border-radius:12px;background:var(--btn);color:var(--btn-fg);font-weight:600;font-size:16px;margin-top:8px;transition:opacity .15s}
.primary:disabled{opacity:.35;cursor:default}
.primary:not(:disabled):active{opacity:.8}
.link{color:var(--fg);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.auth .alt{margin-top:22px;color:var(--fg2);font-size:14px}
.auth .err{min-height:20px;font-size:13px;color:var(--fg);margin:6px 0 2px}
.auth .forgot{margin-top:14px;font-size:13px;color:var(--fg2)}
.notice{max-width:460px;text-align:center}
.notice p{color:var(--fg2);margin-top:10px}
.notice code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;background:var(--bg2);padding:2px 6px;border-radius:6px;color:var(--fg)}

.side{width:340px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.side-head{padding:14px 14px 8px;display:flex;align-items:center;gap:6px}
.side-head h1{flex:1;font-size:26px;font-weight:700;letter-spacing:-.025em;padding-left:4px}
.me-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.search{margin:0 14px 8px;height:36px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--fg2)}
.search .icon{width:16px;height:16px}
.search input{flex:1;height:100%;color:var(--fg);font-size:15px}
.search input::placeholder{color:var(--fg2)}
.list{flex:1;overflow-y:auto;padding:2px 8px 16px}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px 9px 8px;border-radius:12px;cursor:pointer;position:relative;user-select:none}
.item:hover{background:var(--hover)}
.item.active{background:var(--sel)}
.item .dot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent}
.item.unread .dot{background:var(--fg)}
.item .body{flex:1;min-width:0}
.item .top{display:flex;align-items:baseline;gap:8px}
.item .name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .time{font-size:13px;color:var(--fg2);flex:none}
.item .preview{color:var(--fg2);font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px;word-break:break-word}
.item.unread .preview{color:var(--fg)}
.empty{padding:48px 24px;text-align:center;color:var(--fg2)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px;font-weight:600}
.empty .primary{width:auto;padding:0 20px;height:38px;font-size:15px;margin-top:18px;border-radius:19px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.placeholder{flex:1;display:grid;place-items:center;color:var(--fg3);font-size:15px}
.chead{position:absolute;top:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 10px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.chead .who{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;justify-self:center;max-width:100%;padding:2px 10px;border-radius:10px}
.chead .who:hover{background:var(--hover)}
.chead .who .n{font-size:12px;font-weight:500;display:flex;align-items:center;gap:2px;max-width:100%}
.chead .who .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .who .n .icon{width:11px;height:11px;color:var(--fg3);flex:none}
.chead .back{visibility:hidden}
.chead .info{justify-self:end}

.msgs{flex:1;overflow-y:auto;padding:86px 16px 12px;display:flex;flex-direction:column}
.msgs .spacer{flex:1}
.sep{text-align:center;font-size:11.5px;color:var(--fg2);margin:18px 0 8px;font-weight:500}
.sep b{font-weight:600;color:var(--fg2)}
.sys{text-align:center;font-size:12px;color:var(--fg2);margin:6px auto;max-width:80%}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px;position:relative}
.row.first{margin-top:10px}
.row.me{justify-content:flex-end}
.row .av{width:28px;flex:none}
.stack{display:flex;flex-direction:column;max-width:min(72%,560px);min-width:0}
.row.me .stack{align-items:flex-end}
.row.them .stack{align-items:flex-start}
.sender{font-size:11.5px;color:var(--fg2);margin:0 12px 2px}
.bubble{position:relative;padding:8px 13px;border-radius:19px;font-size:15.5px;line-height:1.32;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;cursor:default;transition:transform .12s;user-select:text;-webkit-user-select:text}
.row.me .bubble{background:var(--me);color:var(--me-fg)}
.row.them .bubble{background:var(--them);color:var(--them-fg)}
.row.me:not(.last) .bubble{border-bottom-right-radius:6px}
.row.me:not(.first) .bubble{border-top-right-radius:6px}
.row.them:not(.last) .bubble{border-bottom-left-radius:6px}
.row.them:not(.first) .bubble{border-top-left-radius:6px}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.bubble.big{background:none!important;padding:0 2px;font-size:44px;line-height:1.1}
.bubble.deleted{background:none!important;color:var(--fg2)!important;border:1px solid var(--line2);font-style:italic;font-size:14px}
.row.pending .bubble{opacity:.55}
.reply-ref{font-size:12.5px;color:var(--fg2);padding:6px 11px;margin:0 0 3px;border-radius:14px;border:1px solid var(--line2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.reply-ref b{font-weight:600;color:var(--fg)}
.reply-ref .icon{width:11px;height:11px;display:inline;vertical-align:-1px;margin-right:4px}
.meta{font-size:11px;color:var(--fg2);margin:2px 12px 0}
.receipt{font-size:11px;color:var(--fg2);text-align:right;margin:3px 4px 0;font-weight:500}
.reacts{position:absolute;top:-14px;display:flex;gap:2px;z-index:1}
.row.me .reacts{left:-14px}
.row.them .reacts{right:-14px}
.react{height:24px;min-width:24px;padding:0 6px;border-radius:12px;background:var(--bg2);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;box-shadow:0 0 0 2px var(--bg);cursor:pointer}
.react.mine{background:var(--fg);color:var(--bg)}
.react svg{width:13px;height:13px}
.row.has-react{margin-top:16px}
.more{opacity:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);align-self:center;flex:none;transition:opacity .12s}
.more .icon{width:16px;height:16px}
.more:hover{background:var(--hover)}
.row:hover .more{opacity:1}
.row.me .more{order:-1}
.flash .bubble{transform:scale(1.04)}
.typing{display:flex;gap:4px;padding:12px 14px;border-radius:19px;background:var(--them);width:max-content;margin:10px 0 2px 36px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--fg2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.typing-wrap .who{font-size:11.5px;color:var(--fg2);margin:8px 0 -6px 48px}

.composer{padding:8px 14px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:var(--bg)}
.ctx{display:flex;align-items:center;gap:10px;margin:0 6px 8px;padding:8px 6px 8px 12px;border-left:2px solid var(--fg);font-size:13px;color:var(--fg2)}
.ctx div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx b{color:var(--fg);font-weight:600}
.ctx .ibtn{width:26px;height:26px}
.ctx .icon{width:15px;height:15px}
.cbox{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line2);border-radius:20px;padding:4px 4px 4px 14px;background:var(--bg);transition:border-color .15s}
.cbox:focus-within{border-color:var(--fg3)}
.cbox textarea{flex:1;resize:none;max-height:140px;padding:6px 0;font-size:15.5px;line-height:1.35}
.cbox textarea::placeholder{color:var(--fg3)}
.send{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none;transition:opacity .15s,transform .15s}
.send:disabled{opacity:0;transform:scale(.6);pointer-events:none}
.send .icon{width:16px;height:16px;stroke-width:2.4}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .18s ease}
.sheet{width:100%;max-width:420px;max-height:min(680px,calc(100dvh - 40px));background:var(--bg);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
[data-theme="dark"] .sheet{background:var(--bg2)}
.sheet-head{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.sheet-head h3{text-align:center;font-size:16px;font-weight:600}
.sheet-head .l{justify-self:start;font-size:15px;color:var(--fg2);padding:4px 6px}
.sheet-head .r{justify-self:end;font-size:15px;font-weight:600;padding:4px 6px}
.sheet-head .r:disabled{opacity:.3;cursor:default}
.sheet-body{overflow-y:auto;flex:1}
.to{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:50px}
.to label{color:var(--fg2);margin-right:2px}
.to input{flex:1;min-width:120px;height:28px}
.chip{display:flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 11px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500}
.chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;opacity:.7}
.chip .icon{width:12px;height:12px;stroke-width:2.4}
.gname{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.gname label{color:var(--fg2)}
.gname input{flex:1;height:30px}
.section{font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;padding:14px 16px 6px}
.person{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
.person:hover{background:var(--hover)}
.person .t{flex:1;min-width:0}
.person .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .t .s{font-size:13px;color:var(--fg2)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.person.on .check{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.check .icon{width:13px;height:13px;stroke-width:2.6;opacity:0}
.person.on .check .icon{opacity:1}
.hint{padding:24px 16px;text-align:center;color:var(--fg2);font-size:14px}
.tag{font-size:12px;color:var(--fg2);flex:none}
.small-btn{font-size:13px;font-weight:500;color:var(--fg2);padding:4px 8px;border-radius:8px}
.small-btn:hover{background:var(--hover);color:var(--fg)}
.hero{display:flex;flex-direction:column;align-items:center;padding:26px 16px 18px;gap:10px;text-align:center}
.hero .title{font-size:20px;font-weight:600;letter-spacing:-.01em}
.hero .sub{color:var(--fg2);font-size:14px;margin-top:-6px}
.hero input.title{text-align:center;width:100%;border-radius:10px;padding:4px 8px}
.hero input.title:focus{background:var(--bg2)}
.group-list{margin:0 12px;border-radius:12px;background:var(--bg2);overflow:hidden}
[data-theme="dark"] .group-list{background:var(--bg3)}
.group-list>*+*{border-top:1px solid var(--line)}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;font-size:15px}
button.cell:hover{background:var(--hover)}
.cell .grow{flex:1;min-width:0}
.cell .icon{width:18px;height:18px;color:var(--fg2)}
.cell.strong{font-weight:600}
.seg{display:flex;background:var(--bg3);border-radius:9px;padding:2px;margin:0 12px}
[data-theme="dark"] .seg{background:var(--bg)}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;color:var(--fg2)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
[data-theme="dark"] .seg button.on{background:var(--bg3)}
.pad{height:18px}

.menu{position:fixed;z-index:60;min-width:220px;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-radius:14px;box-shadow:var(--shadow);padding:6px;animation:pop .16s cubic-bezier(.2,.9,.3,1.1)}
.tapbacks{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tapbacks button{flex:1;height:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700}
.tapbacks button:hover{background:var(--hover)}
.tapbacks button.on{background:var(--fg);color:var(--bg)}
.tapbacks svg{width:18px;height:18px}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;text-align:left}
.menu .mi:hover{background:var(--fg);color:var(--bg)}
.menu .mi .icon{width:16px;height:16px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu-scrim{position:fixed;inset:0;z-index:59}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 40px);text-align:center;animation:rise .25s ease}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--fg);animation:spin .8s linear infinite}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .side{width:100%;border-right:0}
  .main{display:none}
  body.in-chat .side{display:none}
  body.in-chat .main{display:flex}
  .chead .back{visibility:visible}
  .stack{max-width:80%}
  .more{display:none}
  .scrim{place-items:end center;padding:0}
  .sheet{max-width:none;border-radius:16px 16px 0 0;max-height:92dvh;animation:slide .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes slide{from{transform:translateY(100%)}}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ms = v => !v ? 0 : typeof v === 'number' ? v : v.toMillis ? v.toMillis() : v.seconds ? v.seconds * 1000 : 0;
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const initials = n => { const p = String(n || '?').trim().split(/\s+/).filter(Boolean); return ((p[0]?.[0] || '?') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const clip = (s, n = 80) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

const ICONS = {
  compose: '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  info: '<circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5"/><path d="M12 8h.01"/>',
  up: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  reply: '<path d="m9 17-5-5 5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',

function avatarHTML(name, size = 40) {

const S = {

function friendly(e) {

    'permission-denied': 'Missing permissions. Publish the A1 Firestore rules.', 'unavailable': 'You appear to be offline.'
  };

function timeShort(t) {
  if (!t) return '';
  const d = new Date(t), n = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / 864e5);
  if (diff === 0) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { month: 'numeric', day: 'numeric', year: '2-digit' });
}
function timeSep(t) {
  const d = new Date(t), n = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / 864e5);
  const tm = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (diff === 0) return `<b>Today</b> ${tm}`;
  if (diff === 1) return `<b>Yesterday</b> ${tm}`;
  if (diff < 7) return `<b>${d.toLocaleDateString([], { weekday: 'long' })}</b> ${tm}`;
  return `<b>${d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric' })}</b> at ${tm}`;
}
function linkify(s) {

}

function renderAuth(mode = 'in') {

function stop() {
  [S.msgUnsub, S.chatsUnsub, S.profileUnsub].forEach(u => { try { u && u(); } catch (e) { } });
  Object.assign(S, { user: null, profile: null, activeId: null, messages: [], msgUnsub: null, chatsUnsub: null, profileUnsub: null, replyTo: null, editing: null, drafts: {}, readMarked: {} });

async function start(u) {
  if (S.user?.uid === u.uid) return;
  stop();
  S.user = u;
  const ref = db.collection('users').doc(u.uid);
  try {
    const snap = await ref.get();
    if (!snap.exists) {
      const name = S.pendingName || u.displayName || (u.email || '').split('@')[0] || 'New User';
      await ref.set({ name, nameLower: name.toLowerCase(), email: u.email || '', emailLower: (u.email || '').toLowerCase(), createdAt: FV.serverTimestamp() });
    }
  } catch (e) { toast(friendly(e)); }
  S.pendingName = null;
  if (S.user?.uid !== u.uid) return;
  S.profileUnsub = ref.onSnapshot(d => { if (d.exists) { S.profile = { id: d.id, ...d.data() }; $('.me-btn')?.replaceChildren(document.createRange().createContextualFragment(avatarHTML(myName(), 30))); } }, () => { });
  renderShell();
  S.chatsUnsub = db.collection('chats').where('members', 'array-contains', u.uid).onSnapshot(qs => {
    S.chats.clear();
    qs.forEach(d => S.chats.set(d.id, { id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    if (S.activeId && !S.chats.has(S.activeId) && !qs.metadata.fromCache) { closeChat(); toast('You’re no longer in that conversation.'); }
    renderList();
    if (S.activeId && S.chats.has(S.activeId)) { renderHeader(); renderTyping(); const k = receiptKey(); if (k !== S.receiptKey) renderMessages(); maybeMarkRead(); }
    updateTitle();
  }, e => toast(friendly(e)));
}

function previewText(c) {

  if (!lm) return c.type === 'group' ? 'New group' : 'No messages yet';
  if (lm.system) return lm.text;
  const who = lm.senderId === uid() ? 'You: ' : c.type === 'group' ? firstName(lm.senderName) + ': ' : '';

}

function renderList() {

  if (S.filter) chats = chats.filter(c => chatTitle(c).toLowerCase().includes(S.filter) || (c.lastMessage?.text || '').toLowerCase().includes(S.filter) || Object.values(c.names || {}).some(n => String(n).toLowerCase().includes(S.filter)));
  if (!chats.length) {

function updateTitle() {

function closeChat() {
  try { S.msgUnsub && S.msgUnsub(); } catch (e) { }

function openChat(id) {

  try { S.msgUnsub && S.msgUnsub(); } catch (e) { }
  S.activeId = id; S.messages = []; S.replyTo = null; S.editing = null; S.receiptKey = ''; S.forceBottom = true;
  document.body.classList.add('in-chat');

    .onSnapshot({ includeMetadataChanges: true }, qs => {
      if (S.activeId !== id) return;

function renderHeader() {

function receiptKey() {
  const c = S.chats.get(S.activeId); if (!c) return '';
  return others(c).map(o => o + ':' + ms(c.lastRead?.[o])).join('|') + '#' + JSON.stringify(c.names || {});

function renderMessages() {
  const box = $('.msgs'), list = $('.mlist'); if (!box || !list) return;
  const c = S.chats.get(S.activeId); if (!c) return;
  S.receiptKey = receiptKey();
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  const me = uid(), group = c.type === 'group', msgs = S.messages;
  let html = '', prev = null;
  const lastMine = [...msgs].reverse().find(m => m.senderId === me && m.type !== 'system');
  if (!msgs.length) html = `<div class="sys" style="margin-top:auto">${group ? 'This is the beginning of the group.' : 'Say hello to ' + esc(firstName(chatTitle(c))) + '.'}</div>`;
  msgs.forEach((m, i) => {
    const t = ms(m.createdAt), next = msgs[i + 1];
    if (!prev || t - ms(prev.createdAt) > 15 * 60e3) html += `<div class="sep">${timeSep(t || Date.now())}</div>`;
    if (m.type === 'system') { html += `<div class="sys">${esc(m.text)}</div>`; prev = m; return; }
    const brk = x => !x || x.type === 'system' || x.senderId !== m.senderId;
    const first = brk(prev) || t - ms(prev.createdAt) > 15 * 60e3;
    const last = brk(next) || ms(next.createdAt) - t > 15 * 60e3;
    const mine = m.senderId === me;
    const reacts = Object.entries(m.reactions || {}).filter(([k, v]) => TB[k] && v && v.length);
    const big = !m.deleted && isEmojiOnly(m.text);
    let cls = `row ${mine ? 'me' : 'them'}${first ? ' first' : ''}${last ? ' last' : ''}${m.pending ? ' pending' : ''}${reacts.length ? ' has-react' : ''}`;
    html += `<div class="${cls}" data-id="${esc(m.id)}">`;
    if (!mine && group) html += `<div class="av">${last ? avatarHTML(m.senderName || c.names?.[m.senderId], 28) : ''}</div>`;
    html += `<div class="stack">`;
    if (!mine && group && first) html += `<div class="sender">${esc(c.names?.[m.senderId] || m.senderName || '')}</div>`;
    if (m.replyTo && !m.deleted) html += `<div class="reply-ref" data-to="${esc(m.replyTo.id)}">${icon('reply')}<b>${esc(m.replyTo.senderId === me ? 'You' : firstName(m.replyTo.senderName))}</b> ${esc(clip(m.replyTo.text, 60))}</div>`;
    html += `<div class="bubble${big ? ' big' : ''}${m.deleted ? ' deleted' : ''}">${m.deleted ? 'Message deleted' : linkify(m.text)}`;
    if (reacts.length) html += `<div class="reacts">${reacts.map(([k, v]) => `<button class="react${v.includes(me) ? ' mine' : ''}" data-k="${k}" title="${esc(v.map(id => id === me ? 'You' : firstName(c.names?.[id]) || 'Someone').join(', '))}">${TB[k]}${v.length > 1 ? `<span>${v.length}</span>` : ''}</button>`).join('')}</div>`;
    html += `</div>`;
    if (m.editedAt && !m.deleted) html += `<div class="meta">Edited</div>`;
    if (lastMine && m.id === lastMine.id) html += `<div class="receipt">${esc(receiptFor(c, m))}</div>`;
    html += `</div>`;
    if (!m.deleted) html += `<button class="more" title="More">${icon('dots')}</button>`;
    html += `</div>`;
    prev = m;
  });
  list.innerHTML = html;
  if (atBottom || S.forceBottom) { box.scrollTop = box.scrollHeight; S.forceBottom = false; }
}

function receiptFor(c, m) {
  if (m.pending) return 'Sending…';
  const t = ms(m.createdAt), o = others(c);
  const read = o.filter(id => ms(c.lastRead?.[id]) >= t);
  if (c.type !== 'group') return read.length ? 'Read' : 'Delivered';
  if (!read.length) return 'Delivered';
  if (read.length === o.length) return o.length === 1 ? 'Read' : 'Read by Everyone';
  return `Read by ${read.length}`;
}

function renderTyping() {

}

function startReply(m) { S.editing = null; S.replyTo = m; renderCtx(); $('.cbox textarea')?.focus(); }
function startEdit(m) {

async function send() {
  const ta = $('.cbox textarea'), c = S.chats.get(S.activeId); if (!ta || !c) return;
  const text = ta.value.trim(); if (!text) return;
  const chatRef = db.collection('chats').doc(c.id);
  if (S.editing) {
    const m = S.editing;
    S.editing = null; ta.value = S.editDraft || ''; S.editDraft = ''; renderCtx(); ta.dispatchEvent(new Event('input'));
    if (text === m.text) return;
    const batch = db.batch();
    batch.update(chatRef.collection('messages').doc(m.id), { text, editedAt: FV.serverTimestamp() });
    if (S.messages[S.messages.length - 1]?.id === m.id) batch.update(chatRef, { 'lastMessage.text': text });
    batch.commit().catch(e => toast(friendly(e)));
    return;
  }
  const msgRef = chatRef.collection('messages').doc();
  const msg = { type: 'text', text, senderId: uid(), senderName: myName(), createdAt: FV.serverTimestamp() };
  if (S.replyTo) msg.replyTo = { id: S.replyTo.id, text: clip(S.replyTo.text, 140), senderId: S.replyTo.senderId, senderName: S.replyTo.senderName || '' };
  const batch = db.batch();
  batch.set(msgRef, msg);
  batch.update(chatRef, { lastMessage: { text: clip(text, 200), senderId: uid(), senderName: myName() }, updatedAt: FV.serverTimestamp(), ['lastRead.' + uid()]: FV.serverTimestamp(), ['typing.' + uid()]: 0 });
  ta.value = ''; S.drafts[c.id] = ''; S.replyTo = null; S.typingSentAt = 0; renderCtx(); ta.dispatchEvent(new Event('input'));
  S.forceBottom = true;
  batch.commit().catch(e => toast(friendly(e)));
}

async function postSystem(chatId, text, extra = {}) {
  const ref = db.collection('chats').doc(chatId);
  const batch = db.batch();
  batch.set(ref.collection('messages').doc(), { type: 'system', text, senderId: uid(), senderName: myName(), createdAt: FV.serverTimestamp() });
  batch.update(ref, { lastMessage: { text, senderId: uid(), senderName: myName(), system: true }, updatedAt: FV.serverTimestamp(), ['lastRead.' + uid()]: FV.serverTimestamp(), ...extra });
  await batch.commit();
}

function toggleReact(msgId, key) {
  const c = S.chats.get(S.activeId), m = S.messages.find(x => x.id === msgId); if (!c || !m || m.deleted) return;
  const me = uid(), had = (m.reactions?.[key] || []).includes(me);
  const upd = {};
  TAPBACKS.forEach(([k]) => {
    if (k === key) upd['reactions.' + k] = had ? FV.arrayRemove(me) : FV.arrayUnion(me);
    else if ((m.reactions?.[k] || []).includes(me)) upd['reactions.' + k] = FV.arrayRemove(me);
  });
  db.collection('chats').doc(c.id).collection('messages').doc(msgId).update(upd).catch(e => toast(friendly(e)));
}

async function deleteMsg(m) {
  const c = S.chats.get(S.activeId); if (!c) return;
  const ref = db.collection('chats').doc(c.id);
  const batch = db.batch();
  batch.update(ref.collection('messages').doc(m.id), { deleted: true, text: '', reactions: {}, replyTo: FV.delete() });
  if (S.messages[S.messages.length - 1]?.id === m.id) batch.update(ref, { 'lastMessage.text': 'Message deleted' });
  batch.commit().catch(e => toast(friendly(e)));
}

async function searchUsers(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const col = db.collection('users'), out = new Map();
  const qs = [col.where('nameLower', '>=', q).where('nameLower', '<=', q + '').limit(12).get()];
  qs.push(q.includes('@') ? col.where('emailLower', '==', q).limit(1).get() : col.where('emailLower', '>=', q).where('emailLower', '<=', q + '').limit(8).get());
  const res = await Promise.allSettled(qs);
  res.forEach(r => r.status === 'fulfilled' && r.value.forEach(d => { if (d.id !== uid()) out.set(d.id, { id: d.id, ...d.data() }); }));
  if (res.every(r => r.status === 'rejected')) throw res[0].reason;
  return [...out.values()];
}
function knownPeople(exclude = []) {
  const seen = new Map();
  [...S.chats.values()].sort((a, b) => ms(b.updatedAt) - ms(a.updatedAt)).forEach(c => others(c).forEach(id => { if (!seen.has(id) && !exclude.includes(id)) seen.set(id, { id, name: c.names?.[id] || 'Unknown' }); }));
  return [...seen.values()].slice(0, 30);
}
async function getUser(id) {
  if (S.users.has(id)) return S.users.get(id);
  const p = db.collection('users').doc(id).get().then(d => d.exists ? { id, ...d.data() } : { id, name: 'Unknown' }).catch(() => ({ id, name: 'Unknown' }));
  S.users.set(id, p); return p;
}

function peoplePicker(sheet, { exclude = [], onChange }) {
  const sel = new Map();
  const to = $('.to', sheet), input = $('.to input', sheet), results = $('.results', sheet);
  let timer, token = 0;
  const personRow = p => `<div class="person${sel.has(p.id) ? ' on' : ''}" data-id="${esc(p.id)}">${avatarHTML(p.name, 36)}<div class="t"><div>${esc(p.name)}</div>${p.email ? `<div class="s">${esc(p.email)}</div>` : ''}</div><div class="check">${icon('check')}</div></div>`;
  let shown = [];
  const draw = (people, label) => {
    shown = people;
    results.innerHTML = people.length ? `<div class="section">${esc(label)}</div>` + people.map(personRow).join('') : `<div class="hint">${input.value.trim() ? 'No people found.' : 'Search for people by name or email.'}</div>`;
    $$('.person', results).forEach(el => el.onclick = () => {
      const p = shown.find(x => x.id === el.dataset.id);
      if (sel.has(p.id)) sel.delete(p.id); else sel.set(p.id, p);
      drawChips(); el.classList.toggle('on', sel.has(p.id)); onChange([...sel.values()]);
      if (input.value) { input.value = ''; run(); }
      input.focus();
    });
  };
  const drawChips = () => {
    $$('.chip', to).forEach(c => c.remove());
    [...sel.values()].forEach(p => {
      const chip = document.createElement('span'); chip.className = 'chip';
      chip.innerHTML = `${esc(firstName(p.name) || p.name)}<button title="Remove">${icon('x')}</button>`;
      $('button', chip).onclick = () => { sel.delete(p.id); drawChips(); run(); onChange([...sel.values()]); };
      to.insertBefore(chip, input);
    });
  };
  const run = () => {
    const q = input.value.trim(), my = ++token;
    if (!q) { draw(knownPeople(exclude), 'Suggested'); return; }
    results.innerHTML = '<div class="hint"><div class="spinner" style="margin:0 auto"></div></div>';
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try { const r = (await searchUsers(q)).filter(p => !exclude.includes(p.id)); if (my === token) draw(r, 'People'); }
      catch (e) { if (my === token) results.innerHTML = `<div class="hint">${esc(friendly(e))}</div>`; }
    }, 220);
  };
  input.oninput = run;
  input.onkeydown = e => {
    if (e.key === 'Backspace' && !input.value && sel.size) { const last = [...sel.keys()].pop(); sel.delete(last); drawChips(); run(); onChange([...sel.values()]); }
    if (e.key === 'Enter') { e.preventDefault(); const first = $('.person', results); if (first && input.value.trim()) first.click(); }
  };
  run();
  setTimeout(() => input.focus(), 40);
  return sel;
}

function openCompose() {
  const s = openSheet({
    title: 'New Message', right: 'Create',
    body: `<div class="to"><label>To:</label><input placeholder="" spellcheck="false" autocomplete="off"></div>
      <div class="gname hidden"><label>Name:</label><input placeholder="Group Name (optional)" maxlength="60"></div>
      <div class="results"></div>`,
    onRight: () => create()
  });
  const r = $('.r', s), gname = $('.gname', s);
  r.disabled = true;
  const sel = peoplePicker(s, {
    onChange: list => { r.disabled = !list.length; gname.classList.toggle('hidden', list.length < 2); r.textContent = list.length > 1 ? 'Create' : 'Message'; }
  });
  r.textContent = 'Message';
  async function create() {
    const people = [...sel.values()]; if (!people.length) return;
    r.disabled = true;
    try {

  }
}

async function openDirect(p) {
  const me = uid(), id = 'd_' + [me, p.id].sort().join('_');
  const ref = db.collection('chats').doc(id);
  let exists = S.chats.has(id);
  if (!exists) { try { exists = (await ref.get()).exists; } catch (e) { exists = false; } }
  if (!exists) {
    await ref.set({ type: 'direct', members: [me, p.id].sort(), names: { [me]: myName(), [p.id]: p.name }, createdBy: me, createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp(), lastRead: {}, typing: {} });
  }
  openChat(id);
}

async function createGroup(name, people) {
  const me = uid(), ref = db.collection('chats').doc();
  const names = { [me]: myName() }; people.forEach(p => names[p.id] = p.name);
  const text = name ? `${myName()} created “${name}”` : `${myName()} created the group`;
  await ref.set({ type: 'group', name, members: [me, ...people.map(p => p.id)], admins: [me], names, createdBy: me, createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp(), lastMessage: { text, senderId: me, senderName: myName(), system: true }, lastRead: { [me]: FV.serverTimestamp() }, typing: {} });
  await ref.collection('messages').add({ type: 'system', text, senderId: me, senderName: myName(), createdAt: FV.serverTimestamp() });
  openChat(ref.id);
}

async function leaveGroup(id) {
  const c = S.chats.get(id); if (!c) return;
  const me = uid(), rest = others(c);
  const extra = { members: FV.arrayRemove(me), admins: FV.arrayRemove(me) };

    body: `<div class="hero">${avatarHTML(myName(), 76)}<input class="title" value="${esc(myName())}" maxlength="40" title="Edit name"><div class="sub">${esc(S.user?.email || '')}</div></div>
      <div class="section">Appearance</div>
      <div class="seg">${['system', 'light', 'dark'].map(v => `<button data-t="${v}" class="${v === pref ? 'on' : ''}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>
      <div class="pad"></div>
      <div class="group-list"><button class="cell" data-out>${icon('leave')}<span class="grow">Sign Out</span></button></div>
      <div class="pad"></div>`
  });
  const ni = $('input.title', s);
  ni.onkeydown = e => { if (e.key === 'Enter') ni.blur(); };
  ni.onblur = async () => {
    const v = ni.value.trim();
    if (!v) { ni.value = myName(); return; }
    if (v === myName()) return;
    try {
      await db.collection('users').doc(uid()).update({ name: v, nameLower: v.toLowerCase() });
      S.user.updateProfile({ displayName: v }).catch(() => { });
      const chats = [...S.chats.values()];
      for (let i = 0; i < chats.length; i += 400) {
        const b = db.batch();
        chats.slice(i, i + 400).forEach(c => b.update(db.collection('chats').doc(c.id), { ['names.' + uid()]: v }));
        await b.commit();
      }
      $('.hero .avatar', s).outerHTML = avatarHTML(v, 76);
      toast('Name updated');
    } catch (e) { toast(friendly(e)); }
  };
  $$('.seg button', s).forEach(b => b.onclick = () => {
    localStorage.setItem('a1-theme', b.dataset.t); applyTheme();
    $$('.seg button', s).forEach(x => x.classList.toggle('on', x === b));
  });
  $('[data-out]', s).onclick = () => { closeSheet(); auth.signOut(); };
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.menu')) { closeMenu(); return; } if ($('.scrim')) { closeSheet(); return; } }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && S.user) { e.preventDefault(); $('.search input')?.focus(); }
  if ((e.metaKey || e.ctrlKey) && e.altKey && e.key.toLowerCase() === 'n' && S.user) { e.preventDefault(); openCompose(); }
});
</script>
</body>
</html>
